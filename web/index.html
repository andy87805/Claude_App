<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>轉檔工具</title>
  <meta name="description" content="在手機上直接轉換、壓縮照片、影片與 PDF，檔案不會上傳。">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="轉檔">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    {
      "imports": {
        "mediabunny": "./vendor/mediabunny.min.mjs",
        "wasm-feature-detect": "./vendor/wasm-feature-detect.js"
      }
    }
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- 圖示（內嵌，離線也能顯示） -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-photo" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="10" r="2" fill="currentColor"/><path d="M4 18l5-5 4 4 3-3 4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="5" width="13" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 10l5-3v10l-5-3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-pdf" viewBox="0 0 24 24"><path d="M6 3h8l5 5v13H6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14 3v5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 13h6M9 17h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></symbol>
    <symbol id="i-convert" viewBox="0 0 24 24"><path d="M4 9h13l-3-3M20 15H7l3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-compress" viewBox="0 0 24 24"><path d="M9 3v6H3M15 3v6h6M9 21v-6H3M15 21v-6h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 10V7a4 4 0 018 0v3" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  </svg>

  <main>
    <header class="hero">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true"><svg><use href="#i-convert"/></svg></span>
        <div>
          <h1>轉檔工具</h1>
          <p class="sub"><svg class="inline-icon" aria-hidden="true"><use href="#i-lock"/></svg>全部在手機上處理，檔案不會上傳</p>
        </div>
      </div>

      <div class="seg seg-full mode" role="radiogroup" aria-label="模式" data-setting="mode">
        <button type="button" data-value="convert"><svg aria-hidden="true"><use href="#i-convert"/></svg>轉換格式</button>
        <button type="button" data-value="compress"><svg aria-hidden="true"><use href="#i-compress"/></svg>壓縮檔案</button>
      </div>
    </header>

    <label class="picker" id="picker">
      <input type="file" id="fileInput" multiple
             accept="image/*,video/*,.heic,.heif,image/heic,image/heif,.mov,.mkv,.webm">
      <span class="picker-types" aria-hidden="true">
        <span class="type type-photo"><svg><use href="#i-photo"/></svg></span>
        <span class="type type-video"><svg><use href="#i-video"/></svg></span>
        <span class="type type-pdf compress-only"><svg><use href="#i-pdf"/></svg></span>
      </span>
      <span class="picker-text" id="pickerText">選擇照片或影片</span>
      <span class="picker-hint">點這裡選取，可一次選多個</span>
      <span class="picker-btn" aria-hidden="true"><svg><use href="#i-plus"/></svg>選擇檔案</span>
    </label>

    <section id="listSection" class="list" hidden>
      <div class="list-head">
        <h2>檔案 <span id="count"></span></h2>
        <button type="button" class="link" id="clearBtn">清除</button>
      </div>
      <div id="summary" class="summary" hidden></div>
      <ul id="fileList" class="files"></ul>
    </section>

    <details class="settings" id="settingsPanel">
      <summary>
        <span class="settings-title"><svg aria-hidden="true"><use href="#i-gear"/></svg>設定</span>
        <span class="chips" id="settingsChips"></span>
        <svg class="chevron" aria-hidden="true"><use href="#i-chevron"/></svg>
      </summary>

      <section class="card compress-only" aria-labelledby="compressTitle">
        <h2 id="compressTitle">壓縮程度</h2>
        <div class="seg seg-full" role="radiogroup" aria-label="壓縮程度" data-setting="level">
          <button type="button" data-value="light">輕度</button>
          <button type="button" data-value="standard">標準</button>
          <button type="button" data-value="strong">強力</button>
        </div>
        <p class="note" id="levelNote"></p>
        <div class="row">
          <label class="label" for="targetSize">每個檔案上限</label>
          <select id="targetSize" data-setting="targetSize">
            <option value="">不限</option>
            <option value="512000">500 KB</option>
            <option value="1048576">1 MB</option>
            <option value="2097152">2 MB</option>
            <option value="5242880">5 MB</option>
            <option value="10485760">10 MB</option>
            <option value="26214400">25 MB（email 附件）</option>
            <option value="52428800">50 MB</option>
            <option value="104857600">100 MB</option>
          </select>
        </div>
        <p class="note">照片會存成 JPG、影片存成 MP4。壓縮後如果沒有變小，會直接保留原檔。</p>
      </section>

      <section class="card convert-only" aria-labelledby="photoTitle">
        <h2 id="photoTitle"><svg class="inline-icon" aria-hidden="true"><use href="#i-photo"/></svg>照片</h2>
        <div class="row">
          <span class="label">轉成</span>
          <div class="seg" role="radiogroup" data-setting="imageFormat">
            <button type="button" data-value="jpg">JPG</button>
            <button type="button" data-value="png">PNG</button>
            <button type="button" data-value="webp">WebP</button>
          </div>
        </div>
        <div class="row" id="qualityRow">
          <label class="label" for="quality">品質 <output id="qualityOut">85</output></label>
          <input type="range" id="quality" min="40" max="100" step="5" data-setting="quality">
        </div>
        <div class="row">
          <label class="label" for="maxSize">尺寸</label>
          <select id="maxSize" data-setting="maxSize">
            <option value="">原尺寸</option>
            <option value="4096">最長邊 4096</option>
            <option value="2560">最長邊 2560</option>
            <option value="1920">最長邊 1920（適合分享）</option>
            <option value="1280">最長邊 1280</option>
          </select>
        </div>
      </section>

      <section class="card convert-only" aria-labelledby="videoTitle">
        <h2 id="videoTitle"><svg class="inline-icon" aria-hidden="true"><use href="#i-video"/></svg>影片</h2>
        <div class="row">
          <span class="label">轉成</span>
          <div class="seg" role="radiogroup" data-setting="videoFormat">
            <button type="button" data-value="mp4">MP4</button>
            <button type="button" data-value="mov">MOV</button>
            <button type="button" data-value="webm">WebM</button>
            <button type="button" data-value="gif">GIF</button>
          </div>
        </div>
        <div class="row video-only">
          <label class="label" for="resolution">解析度</label>
          <select id="resolution" data-setting="resolution">
            <option value="">原尺寸</option>
            <option value="2160p">4K</option>
            <option value="1080p">1080p</option>
            <option value="720p">720p（適合分享）</option>
            <option value="480p">480p</option>
          </select>
        </div>
        <div class="row video-only">
          <span class="label">畫質</span>
          <div class="seg" role="radiogroup" data-setting="videoQuality">
            <button type="button" data-value="high">高</button>
            <button type="button" data-value="medium">中</button>
            <button type="button" data-value="low">低</button>
          </div>
        </div>
        <div class="row gif-only">
          <label class="label" for="gifStart">從第幾秒</label>
          <input type="number" id="gifStart" min="0" step="0.5" inputmode="decimal" data-setting="gifStart">
        </div>
        <div class="row gif-only">
          <label class="label" for="gifDuration">長度（秒）</label>
          <input type="number" id="gifDuration" min="0.5" max="60" step="0.5" inputmode="decimal" data-setting="gifDuration">
        </div>
        <div class="row gif-only">
          <label class="label" for="gifWidth">寬度</label>
          <select id="gifWidth" data-setting="gifWidth">
            <option value="320">320</option>
            <option value="480">480</option>
            <option value="640">640</option>
          </select>
        </div>
        <div class="row gif-only">
          <label class="label" for="gifFps">每秒張數</label>
          <select id="gifFps" data-setting="gifFps">
            <option value="8">8</option>
            <option value="12">12</option>
            <option value="15">15</option>
            <option value="24">24</option>
          </select>
        </div>
      </section>

      <section class="card" aria-labelledby="privacyTitle">
        <h2 id="privacyTitle">拍攝資訊</h2>
        <div class="seg seg-full" role="radiogroup" data-setting="metadata">
          <button type="button" data-value="keep">全部保留</button>
          <button type="button" data-value="nogps">移除位置</button>
          <button type="button" data-value="none">全部移除</button>
        </div>
        <p class="note" id="metadataNote"></p>
      </section>
    </details>

    <p class="footer">
      影片建議 1–2 分鐘以內；太長的影片可能因為手機記憶體不足而失敗。<br>
      加到主畫面：Safari 點「分享」→「加入主畫面」，離線也能用。
    </p>
  </main>

  <div class="actions">
    <button type="button" class="primary" id="convertBtn" disabled>開始轉換</button>
    <button type="button" class="primary" id="saveAllBtn" hidden>全部儲存／分享</button>
    <button type="button" class="secondary" id="downloadAllBtn" hidden><svg aria-hidden="true"><use href="#i-download"/></svg><span>全部下載</span></button>
  </div>

  <template id="itemTemplate">
    <li class="file">
      <div class="thumb"><span class="badge" aria-hidden="true"></span></div>
      <div class="info">
        <div class="name"></div>
        <div class="meta"></div>
        <div class="bar"><span></span></div>
        <div class="msg"></div>
      </div>
      <div class="item-actions"></div>
      <button type="button" class="remove" aria-label="移除這個檔案"><svg aria-hidden="true"><use href="#i-x"/></svg></button>
    </li>
  </template>
</body>
</html>
