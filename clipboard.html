<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>常用剪貼簿</title>
<style>
:root{
  --bg:#ebebed; --card:#fff; --ink:#0c0c0d; --on-ink:#fff; --accent:#2bd96b;
  --mute:rgba(12,12,13,.46); --line:rgba(12,12,13,.09); --soft:rgba(12,12,13,.055);
  --field:#fff; --danger:#e5484d; --hover-shadow:0 10px 26px rgba(0,0,0,.07);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --bounce:cubic-bezier(.3,1.35,.5,1);
  --smooth:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
}
@supports (transition-timing-function:linear(0,1)){
  :root{--spring:linear(0,.009,.035 2.1%,.141 4.4%,.723 12.9%,.938 16.7%,1.017,1.077,1.121,1.149 24.3%,1.159,1.163,1.161,1.154 29.9%,1.129 32.8%,1.051 39.6%,1.017 43.1%,.991,.977 51%,.974 53.8%,.975 57.1%,.997 69.8%,1.003 76.9%,1.004 83.8%,1)}
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b0b0c; --card:#1a1a1d; --ink:#f4f4f5; --on-ink:#0c0c0d;
    --mute:rgba(244,244,245,.5); --line:rgba(255,255,255,.1); --soft:rgba(255,255,255,.07);
    --field:#242428; --danger:#ff6b6f; --hover-shadow:0 10px 26px rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0b0c; --card:#1a1a1d; --ink:#f4f4f5; --on-ink:#0c0c0d;
  --mute:rgba(244,244,245,.5); --line:rgba(255,255,255,.1); --soft:rgba(255,255,255,.07);
  --field:#242428; --danger:#ff6b6f; --hover-shadow:0 10px 26px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{font:500 14px/1.4 "Inter","SF Pro Text","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;padding:28px 20px 96px;user-select:none;cursor:default;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{user-select:text}
.page{max-width:1240px;margin:0 auto}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
kbd{font:600 11px/1 inherit;font-family:inherit;color:var(--mute);background:var(--card);border-radius:6px;padding:4px 6px;box-shadow:0 0 0 1px var(--line);white-space:nowrap}
.lbl{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.04em;margin-bottom:12px;min-height:16px}
.card{background:var(--card);border-radius:28px;padding:20px;position:relative;min-width:0}

/* header */
header{display:flex;align-items:center;gap:12px;padding:6px 6px 22px;flex-wrap:wrap}
header .ttl{flex:1;min-width:180px}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
h1 i{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(43,217,107,.18)}
header p{color:var(--mute);font-size:13px;margin-top:2px}
.srch{display:flex;align-items:center;gap:8px;height:44px;width:min(380px,100%);border-radius:14px;background:var(--card);padding:0 8px 0 12px;border:1.5px solid transparent;transition:border-color .3s,box-shadow .3s}
.srch:focus-within{border-color:var(--ink)}
.srch .ic{color:var(--mute)}
.srch input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-weight:600;color:var(--ink);height:100%}
.srch input::placeholder{color:var(--mute);font-weight:500}
.srch input::-webkit-search-cancel-button{display:none}
.srch .clr{width:26px;height:26px;border-radius:8px;display:none;place-items:center;color:var(--mute)}
.srch.has .clr{display:grid}
.srch.has kbd{display:none}
.srch .clr .ic{width:14px;height:14px}

.btn{height:44px;border-radius:14px;background:var(--ink);color:var(--on-ink);padding:0 16px 0 13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:transform .45s var(--spring),background .3s,color .3s,box-shadow .3s;flex:none}
.btn:active,.tap{transform:scale(.92)!important}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.line{background:none;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.danger{background:none;color:var(--danger);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.danger.arm{background:var(--danger);color:#fff;box-shadow:none}
.btn.sm{height:36px;border-radius:12px;padding:0 12px;font-size:13px}
.btn kbd{background:none;box-shadow:0 0 0 1px currentColor;color:inherit;opacity:.5;padding:3px 5px}

/* layout */
.layout{display:grid;grid-template-columns:248px minmax(0,1fr);gap:16px;align-items:start}
aside{position:sticky;top:20px;display:flex;flex-direction:column;gap:16px}
.lbl .add{width:26px;height:26px;border-radius:9px;background:var(--soft);display:grid;place-items:center;color:var(--ink);transition:transform .45s var(--spring),background .3s}
.lbl .add:hover{background:var(--ink);color:var(--on-ink)}
.lbl .add .ic{width:14px;height:14px;stroke-width:2.6}

.cats{position:relative;display:flex;flex-direction:column;gap:2px;margin:0 -8px}
.cat-pill{position:absolute;left:0;right:0;top:0;height:42px;border-radius:14px;background:var(--ink);transition:transform .7s var(--spring),height .4s var(--smooth);pointer-events:none}
.cat-pill.still{transition:none}
.cat{position:relative;z-index:1;display:flex;align-items:center;gap:10px;height:42px;padding:0 8px 0 12px;border-radius:14px;font-weight:600;cursor:pointer;transition:color .3s,background .25s,box-shadow .25s;text-align:left;width:100%}
.cat:not(.on):hover{background:var(--soft)}
.cat.on{color:var(--on-ink)}
.cat.drop{box-shadow:inset 0 0 0 2px var(--accent);background:rgba(43,217,107,.12)}
.cat .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;margin:0 4px}
.cat .ic{width:18px;height:18px}
.cat .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat .n{font-size:12px;color:var(--mute);min-width:18px;text-align:right;transition:opacity .2s}
.cat.on .n{color:inherit;opacity:.55}
.cat .ed{width:0;height:26px;border-radius:8px;display:grid;place-items:center;overflow:hidden;opacity:0;transition:width .35s var(--spring),opacity .2s,background .2s;flex:none}
.cat .ed .ic{width:14px;height:14px}
.cat:hover .ed,.cat:focus-visible .ed{width:26px;opacity:1}
.cat .ed:hover{background:var(--soft)}
.cat.on .ed:hover{background:rgba(127,127,127,.25)}
.sep{height:1px;background:var(--line);margin:6px 12px}

.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tools .btn{padding:0 10px}
.tools .btn .ic{width:16px;height:16px}
.note{font-size:12px;color:var(--mute);margin-top:12px;line-height:1.5}
.note.warn{color:var(--danger);font-weight:600}
.keys{display:flex;flex-direction:column;gap:9px;font-size:12px;color:var(--mute)}
.keys div{display:flex;align-items:center;justify-content:space-between;gap:8px}
.keys span{display:flex;gap:3px}

/* toolbar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 4px 14px;flex-wrap:wrap}
.bar h2{font-size:18px;font-weight:700;display:flex;align-items:baseline;gap:8px;min-width:0}
.bar h2 small{font-size:13px;font-weight:600;color:var(--mute)}
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:14px;padding:4px;min-width:228px}
.seg button{position:relative;z-index:1;text-align:center;padding:7px 12px;font-size:13px;font-weight:600;color:var(--mute);transition:color .3s}
.seg button.on{color:var(--ink)}
.seg-pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:10px;background:var(--soft);box-shadow:inset 0 0 0 1.5px var(--line);transition:transform .7s var(--spring)}

/* grid of snippets */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.item{background:var(--card);border-radius:24px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px;position:relative;cursor:pointer;outline:0;transition:transform .5s var(--spring),box-shadow .3s,opacity .2s;min-width:0}
.item:hover{transform:translateY(-3px);box-shadow:var(--hover-shadow)}
.item:focus-visible{box-shadow:0 0 0 2px var(--ink),var(--hover-shadow)}
.item.enter{animation:rise .75s var(--bounce) both;animation-delay:calc(min(var(--i,0),14)*35ms)}
.item.pop{animation:pop .6s var(--spring) both}
.item.dragging{opacity:.35;transform:scale(.97)}
.item::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 2px var(--accent);opacity:0;pointer-events:none}
.item.flash::after{animation:flash .9s var(--smooth)}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.96)}}
@keyframes pop{from{opacity:0;transform:scale(.85)}}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.it-h{display:flex;align-items:center;gap:8px;min-height:26px}
.it-t{font-weight:700;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it-cat{font-size:11px;font-weight:600;color:var(--mute);display:inline-flex;align-items:center;gap:5px;flex:none;max-width:40%;white-space:nowrap;overflow:hidden}
.it-cat i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.it-k{font-size:10px;padding:3px 5px}
.pin{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--mute);flex:none;margin-right:-4px;transition:color .2s,background .2s}
.pin:hover{background:var(--soft);color:var(--ink)}
.pin .ic{width:16px;height:16px;transition:transform .55s var(--spring),fill .2s}
.pin.on{color:var(--accent)}
.pin.on .ic{fill:var(--accent);transform:rotate(-8deg) scale(1.08)}
.item:not(:hover):not(:focus-within) .pin:not(.on){opacity:0}
.it-c{background:var(--soft);border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.55;min-height:42px}
.it-c>div{white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;max-height:calc(1.55em*4)}
.it-c.priv{letter-spacing:3px;color:var(--mute)}
.it-c .var{background:var(--card);box-shadow:0 0 0 1px var(--line);border-radius:6px;padding:0 4px;font-size:12px;font-weight:600}
mark{background:rgba(43,217,107,.38);color:inherit;border-radius:3px;padding:0 1px}
.it-f{display:flex;align-items:center;gap:6px;margin-top:auto}
.it-f small{color:var(--mute);font-size:12px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.it-f small .ic{width:13px;height:13px}
.ib{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--mute);transition:opacity .2s,background .2s,color .2s,transform .45s var(--spring);flex:none}
.ib:hover{background:var(--soft);color:var(--ink)}
.ib.del:hover{color:var(--danger)}
.ib .ic{width:16px;height:16px}
.item:not(:hover):not(:focus-within) .ib{opacity:0}
.cp{height:36px;min-width:92px;border-radius:12px;background:var(--ink);color:var(--on-ink);position:relative;overflow:hidden;font-weight:700;font-size:13px;flex:none;transition:background .35s,color .35s,transform .45s var(--spring)}
.cp span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .55s var(--spring),opacity .2s}
.cp .ic{width:15px;height:15px}
.cp .s2{transform:translateY(100%);opacity:0}
.cp .s2 .ic{stroke-width:3}
.cp.done{background:var(--accent);color:#0c0c0d;animation:hopS .55s var(--spring)}
.cp.done .s1{transform:translateY(-100%);opacity:0}
.cp.done .s2{transform:none;opacity:1}
@keyframes hopS{35%{transform:scale(1.06)}}

.empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:48px 20px;animation:rise .7s var(--bounce) both}
.empty>i{width:64px;height:64px;border-radius:20px;background:var(--soft);display:grid;place-items:center;margin-bottom:4px}
.empty>i .ic{width:28px;height:28px}
.empty strong{font-size:17px}
.empty p{color:var(--mute);font-size:13px;max-width:340px;line-height:1.6}
.empty .btn{margin-top:8px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(12,12,13,.34);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;opacity:0;transition:opacity .25s;z-index:50}
.ov.open{opacity:1}
.ov[hidden]{display:none}
.mdl{width:min(580px,100%);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:auto;background:var(--card);border-radius:28px;padding:22px;transform:scale(.92) translateY(16px);transition:transform .6s var(--spring);box-shadow:0 30px 80px rgba(0,0,0,.25)}
.ov.open .mdl{transform:none}
.mdl.shake{animation:shake .45s var(--smooth)}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.mdl h3{font-size:18px;font-weight:700;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between}
.mdl h3 .x{width:32px;height:32px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.mdl h3 .x .ic{width:15px;height:15px}
.fld{margin-bottom:16px}
.fld .lbl{margin-bottom:8px}
.fld .lbl b{color:var(--mute);font-weight:500;letter-spacing:0}
.inp{width:100%;height:46px;border-radius:14px;background:var(--soft);border:1.5px solid transparent;padding:0 14px;font:inherit;font-weight:600;color:var(--ink);outline:0;transition:border-color .25s,background .25s}
.inp::placeholder{color:var(--mute);font-weight:500}
.inp:focus{border-color:var(--ink);background:var(--field)}
.inp.bad{border-color:var(--danger)}
textarea.inp{height:150px;min-height:110px;max-height:46vh;padding:12px 14px;resize:vertical;line-height:1.55;font-weight:500;display:block}
.hint{font-size:12px;color:var(--mute);margin-top:8px;line-height:1.7}
.hint code{font:600 11px/1 inherit;font-family:inherit;background:var(--soft);border-radius:6px;padding:3px 6px;color:var(--ink);cursor:pointer;display:inline-block;margin:1px 0;transition:background .2s}
.hint code:hover{background:var(--accent);color:#0c0c0d}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:99px;box-shadow:inset 0 0 0 1.5px var(--line);font-size:13px;font-weight:600;transition:background .3s,color .3s,box-shadow .3s,transform .4s var(--spring)}
.tag i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tag .ic{width:0;height:14px;margin-right:-6px;opacity:0;stroke-width:3;transition:width .45s var(--spring),margin .45s var(--spring),opacity .2s}
.tag.on{background:var(--ink);color:var(--on-ink);box-shadow:none}
.tag.on .ic{width:14px;margin-right:0;opacity:1;color:var(--accent)}
.tag.on i{display:none}
.tag.new{color:var(--mute);box-shadow:inset 0 0 0 1.5px var(--line);border:0}
.tag.new .ic{width:14px;opacity:1;margin:0;stroke-width:2.4}
.tag input{width:110px;border:0;outline:0;background:none;font:inherit;color:var(--ink)}
.tag.edit{box-shadow:inset 0 0 0 2px var(--ink)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:16px;box-shadow:inset 0 0 0 1.5px var(--line);cursor:pointer}
.row div{font-weight:600}
.row small{display:block;color:var(--mute);font-size:12px;font-weight:500}
.sw{width:48px;height:28px;border-radius:14px;background:rgba(127,127,127,.28);position:relative;transition:background .35s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .6s var(--spring)}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(20px)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:32px;height:32px;border-radius:50%;background:var(--c);box-shadow:0 0 0 0 var(--ink);transition:box-shadow .3s,transform .45s var(--spring)}
.swatches button.on{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--ink);transform:scale(1.05)}
.mf{display:flex;align-items:center;gap:8px;margin-top:20px;flex-wrap:wrap}
.mf .sp{flex:1}
.cnt{font-size:12px;color:var(--mute)}

/* toasts */
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:60;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;background:#0c0c0d;color:#fff;border-radius:18px;padding:8px 14px 8px 8px;box-shadow:0 14px 34px rgba(0,0,0,.25),0 0 0 1px rgba(255,255,255,.08);font-size:13px;font-weight:600;animation:tin .6s var(--spring) both;max-width:100%}
.toast>i{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#0c0c0d;display:grid;place-items:center;flex:none}
.toast>i.bad{background:#ff6b6f}
.toast>i .ic{width:16px;height:16px;stroke-width:2.6}
.toast span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast button{margin-left:6px;margin-right:-6px;height:30px;padding:0 12px;border-radius:10px;background:rgba(255,255,255,.14);color:#fff;font-weight:700;font-size:13px;flex:none}
.toast button:hover{background:var(--accent);color:#0c0c0d}
.toast.out{animation:tout .3s var(--smooth) forwards}
@keyframes tin{from{opacity:0;transform:translateY(24px) scale(.9)}}
@keyframes tout{to{opacity:0;transform:translateY(10px) scale(.94)}}

@media (hover:none){
  .item:not(:hover):not(:focus-within) .ib{opacity:1}
  .it-k,.keys-card{display:none}
}
@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr)}
  aside{display:contents}
  .cats-card{order:1}
  main{order:2}
  .tools-card{order:3}
  aside .cats-card{padding:8px;border-radius:22px}
  aside .cats-card .lbl{display:none}
  .cats{flex-direction:row;overflow-x:auto;margin:0;gap:6px;scrollbar-width:none}
  .cats::-webkit-scrollbar{display:none}
  .cat-pill,.sep{display:none}
  .cat{flex:none;width:auto;height:38px;padding:0 14px 0 12px;background:var(--soft)}
  .cat.on{background:var(--ink)}
  .cat .ed{display:none}
  .keys-card{display:none}
  .tools-card{padding:14px}
  .tools-card .lbl{display:none}
  .tools-card .note{margin-top:8px}
}
@media (min-width:821px){.cat.add-c{display:none}}
@media (max-width:600px){
  body{padding:20px 16px 96px}
  header{padding:0 2px 16px}
  header p{display:none}
  .srch{order:3;width:100%}
  .srch kbd{display:none}
  .grid{grid-template-columns:minmax(0,1fr)}
  .bar{margin:4px 2px 12px}
  .seg{min-width:0;flex:1}
  .mdl{padding:18px;border-radius:24px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important;transition-delay:0ms!important}
}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></symbol>
  <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11.5" height="11.5" rx="2.5"/><path d="M15.5 8.5V6.5A2.5 2.5 0 0 0 13 4H6.5A2.5 2.5 0 0 0 4 6.5V13a2.5 2.5 0 0 0 2.5 2.5h2"/></symbol>
  <symbol id="edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></symbol>
  <symbol id="trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12.5A1.5 1.5 0 0 0 8.5 21h7a1.5 1.5 0 0 0 1.5-1.5L18 7M9 7V4.5h6V7"/></symbol>
  <symbol id="star" viewBox="0 0 24 24"><path d="M12 3.3l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.7l-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z"/></symbol>
  <symbol id="i-all" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.8"/></symbol>
  <symbol id="down" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
  <symbol id="up" viewBox="0 0 24 24"><path d="M12 15V4M7 9l5-5 5 5M5 20h14"/></symbol>
  <symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="clip" viewBox="0 0 24 24"><rect x="5.5" y="5" width="13" height="16" rx="2.5"/><rect x="9" y="3" width="6" height="4" rx="1.5"/><path d="M9 12h6M9 16h4"/></symbol>
  <symbol id="inbox" viewBox="0 0 24 24"><path d="M4 13l2.5-7.5h11L20 13v5.5A1.5 1.5 0 0 1 18.5 20h-13A1.5 1.5 0 0 1 4 18.5z"/><path d="M4 13h4.5l1 2.5h5l1-2.5H20"/></symbol>
</svg>

<div class="page">
<header>
  <div class="ttl"><h1><i></i>常用剪貼簿</h1><p id="sub">點一下卡片就能複製</p></div>
  <label class="srch" id="srch"><svg class="ic"><use href="#search"/></svg><input id="q" type="search" placeholder="搜尋標題、內容或分類" autocomplete="off" spellcheck="false"><button class="clr" id="qclr" type="button" title="清除搜尋"><svg class="ic"><use href="#x"/></svg></button><kbd>/</kbd></label>
  <button class="btn" id="addBtn" type="button"><svg class="ic"><use href="#plus"/></svg>新增</button>
</header>

<div class="layout">
  <aside>
    <section class="card cats-card">
      <div class="lbl">分類<button class="add" id="addCat" type="button" title="新增分類"><svg class="ic"><use href="#plus"/></svg></button></div>
      <nav class="cats" id="cats"></nav>
    </section>
    <section class="card tools-card">
      <div class="lbl">備份</div>
      <div class="tools">
        <button class="btn ghost sm" id="expBtn" type="button"><svg class="ic"><use href="#down"/></svg>匯出</button>
        <button class="btn ghost sm" id="impBtn" type="button"><svg class="ic"><use href="#up"/></svg>匯入</button>
      </div>
      <p class="note" id="note">資料只存在這台電腦的瀏覽器裡，不會上傳。換電腦或清除瀏覽資料前請先匯出備份。</p>
      <input type="file" id="impFile" accept=".json,application/json" hidden>
    </section>
    <section class="card keys-card">
      <div class="lbl">快捷鍵</div>

        <div>複製第 1–9 則<span><kbd>1</kbd>–<kbd>9</kbd></span></div>
        <div>搜尋<span><kbd>/</kbd></span></div>
        <div>搜尋後複製第一則<span><kbd>Enter</kbd></span></div>

  <main>
    <div class="bar">
      <h2 id="ttl">全部<small class="num" id="cnt"></small></h2>
      <div class="seg" id="sort"><i class="seg-pill"></i><button type="button" data-s="manual" title="可拖曳卡片排序">自訂</button><button type="button" data-s="used">最常用</button><button type="button" data-s="recent">最近用</button></div>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<div class="ov" id="ov" hidden><div class="mdl" id="mdl" role="dialog" aria-modal="true"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
'use strict';
const $=(s,e=document)=>e.querySelector(s), $$=(s,e=document)=>[...e.querySelectorAll(s)];
const ic=(n,c='')=>`<svg class="ic ${c}"><use href="#${n}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const reduce=matchMedia('(prefers-reduced-motion: reduce)');
const KEY='clipbox.v1';
const COLORS=['#2bd96b','#4a8cff','#ff9f43','#ff5c7a','#a66bff','#16c1c8','#f2c94c','#8a8a8e'];

/* ---------- 資料 ---------- */
let db, storageOK=true;
const state={cat:'all',q:'',sort:'manual'};

function seed(){
  const c=[['常用回覆','#2bd96b'],['個人資料','#4a8cff'],['工作','#ff9f43'],['程式指令','#a66bff']].map(([name,color])=>({id:uid(),name,color}));
  const now=Date.now();
  const it=(cat,title,content,o={})=>({id:uid(),title,content,cat:c[cat].id,pin:false,priv:false,count:0,last:0,created:now,...o});
  return {v:1,cats:c,prefs:{sort:'manual',cat:'all'},items:[
    it(0,'收到，稍後回覆','收到，我現在不方便，稍後再回覆你 🙏',{pin:true}),
    it(0,'感謝來信','您好，謝謝您的來信！\n相關資料我已收到，會在 {{date}} 下班前回覆您。\n\n祝 順心'),
    it(1,'電子郵件','your.name@example.com'),
    it(1,'收件地址','（請改成你的地址）台北市○○區○○路 1 號 10 樓'),
    it(1,'銀行帳號','（822）1234-5678-9012',{priv:true}),
    it(2,'工作日報','【{{date}}（{{weekday}}）工作日報】\n✅ 今日完成：\n🔜 明日計畫：\n⚠️ 需要協助：'),
    it(2,'會議連結','會議時間：{{date}} {{time}}\n連結：https://meet.example.com/abc-defg-hij'),
    it(3,'Git 一次提交','git add -A && git commit -m "更新" && git push'),
    it(3,'本機網頁伺服器','python3 -m http.server 8000'),
  ]};
}
function normalize(d){
  if(!d||typeof d!=='object')return null;
  d.cats=Array.isArray(d.cats)?d.cats.filter(c=>c&&c.id&&typeof c.name==='string'):[];
  d.items=Array.isArray(d.items)?d.items.filter(i=>i&&i.id&&typeof i.content==='string'):[];
  d.items.forEach(i=>{i.title=typeof i.title==='string'?i.title:'';i.count=+i.count||0;i.last=+i.last||0;i.created=+i.created||Date.now();i.pin=!!i.pin;i.priv=!!i.priv;if(i.cat&&!d.cats.some(c=>c.id===i.cat))i.cat=null});
  d.cats.forEach((c,k)=>{if(!c.color)c.color=COLORS[k%COLORS.length]});
  d.prefs=Object.assign({sort:'manual',cat:'all'},d.prefs||{});
  return d;
}
// seeded：目前顯示的是範例資料、還沒寫入過。這時候絕不覆蓋儲存區裡已有的資料
let seeded=false;
function readStored(){
  let raw=null;
  try{raw=localStorage.getItem(KEY)}catch(e){storageOK=false}
  if(!raw)return null;
  try{const d=normalize(JSON.parse(raw));if(d)return d}catch(e){}
  // 資料壞掉時先另存一份，避免被覆蓋後救不回來
  try{localStorage.setItem(KEY+'.corrupt-'+Date.now(),raw)}catch(e){}
  return null;
}
function applyPrefs(){
  state.sort=['manual','used','recent'].includes(db.prefs.sort)?db.prefs.sort:'manual';
  state.cat=db.prefs.cat||'all';
}
function load(){
  db=readStored();
  seeded=!db;
  if(!db)db=seed();
  applyPrefs();
}
function save(){
  if(seeded){
    const stored=readStored();
    if(stored){ // 儲存區其實有資料（例如瀏覽器較晚才讀到）→ 改用它，不覆蓋
      db=stored;seeded=false;applyPrefs();render();
      toast('已載入先前儲存的資料','check',{ms:2600});
      return false;
    }
    seeded=false;
  }
  db.prefs.sort=state.sort;db.prefs.cat=state.cat;
  try{localStorage.setItem(KEY,JSON.stringify(db));storageOK=true}catch(e){storageOK=false}
  const n=$('#note');
  if(!storageOK){n.classList.add('warn');n.textContent='這個瀏覽器不允許儲存資料，關閉頁面後內容會消失，請記得用「匯出」備份。'}
  return true;
}

const catById=id=>db.cats.find(c=>c.id===id);
const firstLine=s=>(s.split('\n').find(l=>l.trim())||'').trim();
const titleOf=it=>it.title.trim()||firstLine(it.content).slice(0,40)||'（空白）';

/* ---------- 變數 ---------- */
const pad=n=>String(n).padStart(2,'0');
const VARS={
  date:d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,
  time:d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`,
  weekday:d=>'星期'+'日一二三四五六'[d.getDay()],
};
VARS['日期']=VARS.date;VARS['時間']=VARS.time;VARS['星期']=VARS.weekday;
const VAR_RE=/\{\{\s*(date|time|weekday|日期|時間|星期)\s*\}\}/g;
const VAR_LABEL={date:'日期',time:'時間',weekday:'星期'};
const MOD=/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent)?'⌘':'Ctrl';
const expand=s=>{const d=new Date();return s.replace(VAR_RE,(_,k)=>VARS[k](d))};

/* ---------- 剪貼簿 ---------- */
async function writeClip(text){
  if(navigator.clipboard&&window.isSecureContext){
    try{await navigator.clipboard.writeText(text);return true}catch(e){}
  }
  const active=document.activeElement;
  const ta=document.createElement('textarea');
  ta.value=text;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0;pointer-events:none';
  document.body.append(ta);ta.select();ta.setSelectionRange(0,text.length);
  let ok=false;try{ok=document.execCommand('copy')}catch(e){}
  ta.remove();if(active&&active.focus)active.focus({preventScroll:true});
  return ok;
}

/* ---------- 篩選與排序 ---------- */
const terms=()=>state.q.toLowerCase().split(/\s+/).filter(Boolean);
function inCat(it,cat){
  if(cat==='all')return true;
  if(cat==='pin')return it.pin;
  if(cat==='none')return !it.cat;
  return it.cat===cat;
}
function visible(){
  const t=terms();
  let list=db.items.filter(it=>inCat(it,state.cat));
  if(t.length)list=list.filter(it=>{
    const hay=(it.title+'\n'+(it.priv?'':it.content)+'\n'+(catById(it.cat)?.name||'')).toLowerCase();
    return t.every(w=>hay.includes(w));
  });
  const idx=new Map(db.items.map((it,i)=>[it.id,i]));
  const by={manual:(a,b)=>idx.get(a.id)-idx.get(b.id),used:(a,b)=>b.count-a.count||b.last-a.last||idx.get(a.id)-idx.get(b.id),recent:(a,b)=>b.last-a.last||idx.get(a.id)-idx.get(b.id)}[state.sort];
  return list.sort((a,b)=>(b.pin-a.pin)||by(a,b));
}
const canReorder=()=>state.sort==='manual'&&!state.q;

/* ---------- 文字標示 ---------- */
function hl(text,t){
  let h;
  if(!t.length)h=esc(text);
  else{
    const re=new RegExp('('+t.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');
    h=text.split(re).map((p,i)=>i%2?`<mark>${esc(p)}</mark>`:esc(p)).join('');
  }
  return h;
}
function previewHTML(it,t){
  if(it.priv)return '•'.repeat(Math.min(14,Math.max(6,it.content.length)));
  // 先標示搜尋字，再把 {{變數}} 包成小標籤（變數不含 HTML 字元，可直接在跳脫後的字串上取代）
  return hl(it.content,t).replace(/\{\{\s*(date|time|weekday|日期|時間|星期)\s*\}\}/g,(m,k)=>`<span class="var">${VAR_LABEL[k]||k}</span>`);
}
function ago(ts){
  if(!ts)return '';
  const s=(Date.now()-ts)/1000;
  if(s<60)return '剛剛';
  if(s<3600)return Math.floor(s/60)+' 分鐘前';
  if(s<86400)return Math.floor(s/3600)+' 小時前';
  if(s<86400*30)return Math.floor(s/86400)+' 天前';
  const d=new Date(ts);return `${d.getMonth()+1}/${d.getDate()}`;
}
const metaHTML=it=>(it.priv?ic('lock'):'')+(it.count?`已複製 ${it.count} 次 · ${ago(it.last)}`:(it.priv?'私密內容':'尚未使用'));

/* ---------- 繪製 ---------- */
const grid=$('#grid'), catsEl=$('#cats');

function renderCats(){
  const cnt=id=>db.items.filter(it=>inCat(it,id)).length;
  const rows=[
    `<button class="cat" data-cat="all" type="button">${ic('i-all')}<span class="nm">全部</span><span class="n num">${db.items.length}</span></button>`,
    `<button class="cat" data-cat="pin" type="button">${ic('star')}<span class="nm">釘選</span><span class="n num">${cnt('pin')}</span></button>`,
    `<i class="sep"></i>`,
    ...db.cats.map(c=>`<button class="cat" data-cat="${c.id}" type="button" style="--c:${c.color}"><i class="dot"></i><span class="nm">${esc(c.name)}</span><span class="n num">${cnt(c.id)}</span><span class="ed" data-edit="${c.id}" title="編輯分類">${ic('edit')}</span></button>`),
  ];
  const none=cnt('none');
  if(none)rows.push(`<button class="cat" data-cat="none" type="button" style="--c:var(--mute)"><i class="dot"></i><span class="nm">未分類</span><span class="n num">${none}</span></button>`);
  rows.push(`<button class="cat add-c" type="button" data-newcat="1">${ic('plus')}<span class="nm">分類</span></button>`);
  if(!['all','pin','none'].includes(state.cat)&&!catById(state.cat))state.cat='all';
  if(state.cat==='none'&&!none)state.cat='all';
  const pill=$('.cat-pill',catsEl)||document.createElement('i');
  pill.className='cat-pill';
  catsEl.innerHTML=rows.join('');catsEl.prepend(pill);
  $$('.cat',catsEl).forEach(b=>b.classList.toggle('on',b.dataset.cat===state.cat));
  movePill(!movePill.done);movePill.done=true;
}
function movePill(instant){
  const on=$('.cat.on',catsEl),pill=$('.cat-pill',catsEl);
  if(!on||!pill)return;
  pill.classList.toggle('still',!!instant);
  pill.style.transform=`translateY(${on.offsetTop}px)`;pill.style.height=on.offsetHeight+'px';
  if(instant){pill.offsetWidth;pill.classList.remove('still')}
  if(getComputedStyle(catsEl).flexDirection==='row')on.scrollIntoView({block:'nearest',inline:'nearest',behavior:instant?'auto':'smooth'});
}
function renderSort(){
  const bs=$$('#sort button'),k=bs.findIndex(b=>b.dataset.s===state.sort);
  bs.forEach((b,j)=>b.classList.toggle('on',j===k));
  $('#sort .seg-pill').style.transform=`translateX(${k*100}%)`;
}
function cardHTML(it,i,t){
  const c=catById(it.cat);
  const showCat=c&&state.cat!==it.cat;
  return `<article class="item" tabindex="0" draggable="true" data-id="${it.id}" style="--i:${i}">
    <div class="it-h">${i<9?`<kbd class="it-k">${i+1}</kbd>`:''}<div class="it-t">${hl(titleOf(it),t)}</div>${showCat?`<span class="it-cat" style="--c:${c.color}"><i></i>${esc(c.name)}</span>`:''}<button class="pin${it.pin?' on':''}" data-act="pin" type="button" title="${it.pin?'取消釘選':'釘選到最前面'}">${ic('star')}</button></div>
    <div class="it-c${it.priv?' priv':''}"><div>${previewHTML(it,t)}</div></div>
    <div class="it-f"><small class="meta">${metaHTML(it)}</small><button class="ib" data-act="edit" type="button" title="編輯 (E)">${ic('edit')}</button><button class="ib del" data-act="del" type="button" title="刪除 (Del)">${ic('trash')}</button><button class="cp" data-act="copy" type="button"><span class="s1">${ic('copy')}複製</span><span class="s2">${ic('check')}已複製</span></button></div>
  </article>`;
}
function emptyHTML(){
  if(state.q)return `<div class="card empty"><i>${ic('search')}</i><strong>找不到「${esc(state.q)}」</strong><p>試試其他關鍵字，或直接新增一則。</p><button class="btn" type="button" data-empty="new">${ic('plus')}新增「${esc(state.q.slice(0,12))}」</button></div>`;
  if(state.cat==='pin')return `<div class="card empty"><i>${ic('star')}</i><strong>還沒有釘選的項目</strong><p>在卡片右上角按星號，常用的內容就會固定在最前面。</p></div>`;
  return `<div class="card empty"><i>${ic('clip')}</i><strong>這裡還是空的</strong><p>按「新增」，或在頁面上直接按 <kbd>Ctrl</kbd> <kbd>V</kbd> 貼上，就能把剪貼簿內容存起來。</p><button class="btn" type="button" data-empty="new">${ic('plus')}新增第一則</button></div>`;
}
function render(anim){
  const list=visible(),t=terms();
  grid.innerHTML=list.length?list.map((it,i)=>cardHTML(it,i,t)).join(''):emptyHTML();
  if(anim&&!reduce.matches)$$('.item',grid).forEach(el=>el.classList.add('enter'));
  const name=state.cat==='all'?'全部':state.cat==='pin'?'釘選':state.cat==='none'?'未分類':catById(state.cat)?.name||'全部';
  $('#ttl').firstChild.textContent=name;
  $('#cnt').textContent=state.q?`找到 ${list.length} 則`:`${list.length} 則`;
  $('#sub').textContent=`共 ${db.items.length} 則 · 點一下卡片就能複製`;
  grid.classList.toggle('sortable',canReorder());
  renderCats();renderSort();
}
// 位置變化時用 FLIP 做彈性移動
function flip(fn){
  const first=new Map($$('.item',grid).map(el=>[el.dataset.id,el.getBoundingClientRect()]));
  fn();
  if(reduce.matches)return;
  $$('.item',grid).forEach(el=>{
    const f=first.get(el.dataset.id);
    if(!f){el.classList.add('pop');return}
    const l=el.getBoundingClientRect(),dx=f.left-l.left,dy=f.top-l.top;
    if(Math.abs(dx)<1&&Math.abs(dy)<1)return;
    el.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:620,easing:'cubic-bezier(.34,1.56,.64,1)'});
  });
}

/* ---------- 動作 ---------- */
const itemById=id=>db.items.find(i=>i.id===id);
const cardOf=id=>grid.querySelector(`.item[data-id="${id}"]`);

async function copyItem(it){
  const ok=await writeClip(expand(it.content));
  if(!ok){toast('複製失敗，瀏覽器不允許存取剪貼簿','x',{bad:true});return}
  it.count++;it.last=Date.now();save();
  const el=cardOf(it.id);
  if(el){
    $('.meta',el).innerHTML=metaHTML(it);
    const b=$('.cp',el);b.classList.remove('done');b.offsetWidth;b.classList.add('done');
    clearTimeout(b._t);b._t=setTimeout(()=>b.classList.remove('done'),1500);
    el.classList.remove('flash');el.offsetWidth;el.classList.add('flash');
  }
  toast(`已複製「${titleOf(it)}」`,'check',{key:'copy',ms:1600});
}
function togglePin(it){
  it.pin=!it.pin;save();
  flip(()=>render());
  const el=cardOf(it.id);if(el)el.focus({preventScroll:true});
  toast(it.pin?`已釘選「${titleOf(it)}」`:`已取消釘選`,'star',{key:'pin',ms:1400});
}
function delItem(it){
  const idx=db.items.indexOf(it);if(idx<0)return;
  const vis=visible(),pos=vis.indexOf(it);
  db.items.splice(idx,1);save();
  flip(()=>render());
  const next=$$('.item',grid)[Math.min(pos,$$('.item',grid).length-1)];if(next)next.focus({preventScroll:true});
  toast(`已刪除「${titleOf(it)}」`,'trash',{ms:6000,action:{label:'復原',fn:()=>{db.items.splice(Math.min(idx,db.items.length),0,it);save();flip(()=>render());}}});
}

/* ---------- 通知 ---------- */
const toastsEl=$('#toasts');
function toast(msg,icon='check',o={}){
  if(o.key)$$(`.toast[data-key="${o.key}"]`,toastsEl).forEach(dismiss);
  const t=document.createElement('div');t.className='toast';if(o.key)t.dataset.key=o.key;
  t.innerHTML=`<i class="${o.bad?'bad':''}">${ic(icon)}</i><span>${esc(msg)}</span>`;
  if(o.action){const b=document.createElement('button');b.type='button';b.textContent=o.action.label;b.onclick=()=>{o.action.fn();dismiss(t)};t.append(b)}
  toastsEl.append(t);
  while(toastsEl.children.length>3)toastsEl.firstChild.remove();
  t._t=setTimeout(()=>dismiss(t),o.ms||2200);
}
function dismiss(t){if(t._gone)return;t._gone=1;clearTimeout(t._t);t.classList.add('out');setTimeout(()=>t.remove(),300)}

/* ---------- 對話框 ---------- */
const ov=$('#ov'),mdl=$('#mdl');
let modal=null; // {save(),dirty()}
function openModal(html,ctl){
  mdl.innerHTML=html;modal=ctl;ov.hidden=false;ov.offsetWidth;ov.classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(){
  if(!modal)return;modal=null;ov.classList.remove('open');document.body.style.overflow='';
  setTimeout(()=>{if(!modal){ov.hidden=true;mdl.innerHTML=''}},280);
}
function shake(){mdl.classList.remove('shake');mdl.offsetWidth;mdl.classList.add('shake')}
let downOnOv=false;
ov.addEventListener('mousedown',e=>downOnOv=e.target===ov);
ov.addEventListener('click',e=>{if(e.target===ov&&downOnOv){modal&&modal.dirty()?shake():closeModal()}});

function chipsHTML(sel){
  return [`<button type="button" class="tag${!sel?' on':''}" data-pick="" style="--c:var(--mute)">${ic('check')}<i></i>未分類</button>`,
    ...db.cats.map(c=>`<button type="button" class="tag${sel===c.id?' on':''}" data-pick="${c.id}" style="--c:${c.color}">${ic('check')}<i></i>${esc(c.name)}</button>`),
    `<button type="button" class="tag new" data-newchip="1">${ic('plus')}新分類</button>`].join('');
}
function openItem(id,preset={}){
  const it=id?itemById(id):null;
  const real=!['all','pin','none'].includes(state.cat)?state.cat:null;
  let sel=it?it.cat:(preset.cat!==undefined?preset.cat:real), priv=it?it.priv:false;
  const init={title:it?it.title:(preset.title||''),content:it?it.content:(preset.content||'')};
  openModal(`<h3>${it?'編輯內容':'新增內容'}<button class="x" type="button" data-close="1" title="關閉 (Esc)">${ic('x')}</button></h3>
    <div class="fld"><div class="lbl">內容<b class="cnt num" id="mCnt"></b></div><textarea class="inp" id="mContent" placeholder="要複製的文字，可以多行" spellcheck="false"></textarea>
      <p class="hint">插入會自動帶入的變數：<code data-var="{{date}}">日期</code> <code data-var="{{time}}">時間</code> <code data-var="{{weekday}}">星期</code></p></div>
    <div class="fld"><div class="lbl">標題<b>可留空，會用內容第一行</b></div><input class="inp" id="mTitle" maxlength="80" autocomplete="off"></div>
    <div class="fld"><div class="lbl">分類</div><div class="chips" id="mChips">${chipsHTML(sel)}</div></div>
    <div class="row" id="mPriv"><div>私密內容<small>卡片上用 •••• 遮住，複製時仍是原文</small></div><i class="sw${priv?' on':''}"></i></div>
    <div class="mf">${it?`<button class="btn danger sm" type="button" id="mDel">${ic('trash')}刪除</button>`:''}<span class="sp"></span><button class="btn line sm" type="button" data-close="1">取消</button><button class="btn sm" type="button" id="mSave">${ic('check')}儲存 <kbd>${MOD} ↵</kbd></button></div>`,
  {
    dirty:()=>ta.value!==init.content||ti.value!==init.title,
    save(){
      const content=ta.value;
      if(!content.trim()){ta.classList.add('bad');ta.focus();shake();return}
      const title=ti.value.trim();
      let target;
      if(it){Object.assign(it,{content,title,cat:sel,priv});target=it}
      else{target={id:uid(),title,content,cat:sel,pin:state.cat==='pin',priv,count:0,last:0,created:Date.now()};db.items.unshift(target)}
      // 確保新項目在目前畫面看得到
      if(!inCat(target,state.cat))state.cat=sel||'all';
      if(!it&&state.q){state.q='';$('#q').value='';syncSearch()}
      if(!save()){closeModal();return}closeModal();
      flip(()=>render());
      const el=cardOf(target.id);
      if(el){el.scrollIntoView({block:'nearest',behavior:reduce.matches?'auto':'smooth'});el.classList.add('flash');el.focus({preventScroll:true})}
      toast(it?'已儲存':`已新增「${titleOf(target)}」`);
    }
  });
  const ta=$('#mContent'),ti=$('#mTitle'),cnt=$('#mCnt');
  ta.value=init.content;ti.value=init.title;
  const upd=()=>{cnt.textContent=ta.value?`${ta.value.length} 字`:'';ti.placeholder=firstLine(ta.value).slice(0,40)||'例如：公司地址';ta.classList.remove('bad');
    ta.style.height='auto';ta.style.height=Math.min(Math.max(ta.scrollHeight+3,150),innerHeight*.46)+'px'};
  ta.addEventListener('input',upd);upd();
  $$('[data-var]',mdl).forEach(b=>b.addEventListener('click',()=>{
    const v=b.dataset.var,s=ta.selectionStart,e=ta.selectionEnd;
    ta.setRangeText(v,s,e,'end');ta.focus();upd();
  }));
  const chips=$('#mChips');
  chips.addEventListener('click',e=>{
    const p=e.target.closest('[data-pick]');
    if(p){sel=p.dataset.pick||null;$$('[data-pick]',chips).forEach(x=>x.classList.toggle('on',x===p));return}
    const n=e.target.closest('[data-newchip]');
    if(n&&!n.classList.contains('edit')){
      n.classList.add('edit');n.innerHTML=`<input placeholder="分類名稱" maxlength="20">`;
      const inp=$('input',n);inp.focus();
      let fin=false;
      const done=ok=>{
        if(fin)return;fin=true;
        const name=inp.value.trim();
        if(ok&&name){
          let c=db.cats.find(x=>x.name===name);
          if(!c){c={id:uid(),name,color:COLORS[db.cats.length%COLORS.length]};db.cats.push(c);save();renderCats()}
          sel=c.id;
        }
        chips.innerHTML=chipsHTML(sel);
      };
      inp.addEventListener('keydown',ev=>{
        if(ev.key==='Enter'){ev.preventDefault();ev.stopPropagation();done(true)}
        else if(ev.key==='Escape'){ev.preventDefault();ev.stopPropagation();done(false)}
      });
      inp.addEventListener('blur',()=>{if(n.isConnected)done(true)});
    }
  });
  $('#mPriv').addEventListener('click',()=>{priv=!priv;$('#mPriv .sw').classList.toggle('on',priv)});
  $('#mSave').addEventListener('click',()=>modal.save());
  const del=$('#mDel');
  if(del)del.addEventListener('click',()=>{closeModal();delItem(it)});
  (preset.content&&!it?ti:ta).focus();
}

function openCat(id){
  const c=id?catById(id):null;
  let color=c?c.color:COLORS[db.cats.length%COLORS.length];
  const n=c?db.items.filter(i=>i.cat===c.id).length:0;
  openModal(`<h3>${c?'編輯分類':'新增分類'}<button class="x" type="button" data-close="1" title="關閉 (Esc)">${ic('x')}</button></h3>
    <div class="fld"><div class="lbl">名稱</div><input class="inp" id="cName" maxlength="20" placeholder="例如：客服回覆" autocomplete="off"></div>
    <div class="fld"><div class="lbl">顏色</div><div class="swatches" id="cSw">${COLORS.map(x=>`<button type="button" data-c="${x}" style="--c:${x}" class="${x===color?'on':''}" title="${x}"></button>`).join('')}</div></div>
    <div class="mf">${c?`<button class="btn danger sm" type="button" id="cDel">${ic('trash')}<span>刪除分類</span></button>`:''}<span class="sp"></span><button class="btn line sm" type="button" data-close="1">取消</button><button class="btn sm" type="button" id="cSave">${ic('check')}儲存</button></div>
    ${c&&n?`<p class="hint">刪除後，這個分類裡的 ${n} 則內容會移到「未分類」，不會被刪掉。</p>`:''}`,
  {
    dirty:()=>name.value.trim()!==(c?c.name:''),
    save(){
      const v=name.value.trim();
      if(!v){name.classList.add('bad');name.focus();shake();return}
      const dup=db.cats.find(x=>x.name===v&&x!==c);
      if(dup){name.classList.add('bad');shake();toast('已經有同名的分類了','x',{bad:true});return}
      if(c){c.name=v;c.color=color}else{const nc={id:uid(),name:v,color};db.cats.push(nc);state.cat=nc.id}
      if(!save()){closeModal();return}closeModal();render(!c);toast(c?'分類已更新':`已新增分類「${v}」`);
    }
  });
  const name=$('#cName');name.value=c?c.name:'';name.focus();name.select();
  name.addEventListener('input',()=>name.classList.remove('bad'));
  name.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();modal.save()}});
  $('#cSw').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;color=b.dataset.c;$$('#cSw button').forEach(x=>x.classList.toggle('on',x===b))});
  $('#cSave').addEventListener('click',()=>modal.save());
  const del=$('#cDel');
  if(del)del.addEventListener('click',()=>{
    if(!del.classList.contains('arm')){del.classList.add('arm');$('span',del).textContent='再按一次確認';setTimeout(()=>{if(del.isConnected){del.classList.remove('arm');$('span',del).textContent='刪除分類'}},3000);return}
    db.items.forEach(i=>{if(i.cat===c.id)i.cat=null});
    db.cats=db.cats.filter(x=>x!==c);
    if(state.cat===c.id)state.cat='all';
    if(!save()){closeModal();return}closeModal();render(true);toast(`已刪除分類「${c.name}」`,'trash');
  });
}
mdl.addEventListener('click',e=>{if(e.target.closest('[data-close]'))closeModal()});

/* ---------- 事件：卡片 ---------- */
grid.addEventListener('click',e=>{
  if(e.target.closest('[data-empty]')){openItem(null,state.q?{title:state.q}:{});return}
  const el=e.target.closest('.item');if(!el)return;
  const it=itemById(el.dataset.id);if(!it)return;
  const act=e.target.closest('[data-act]')?.dataset.act||'copy';
  const b=e.target.closest('button');if(b){b.classList.add('tap');setTimeout(()=>b.classList.remove('tap'),160)}
  if(act==='copy')copyItem(it);
  else if(act==='edit')openItem(it.id);
  else if(act==='del')delItem(it);
  else if(act==='pin')togglePin(it);
});
grid.addEventListener('dblclick',e=>{const el=e.target.closest('.item');if(el&&!e.target.closest('button'))openItem(el.dataset.id)});
grid.addEventListener('keydown',e=>{
  const el=e.target.closest('.item');
  if(!el||e.target!==el||e.ctrlKey||e.metaKey||e.altKey)return;
  const it=itemById(el.dataset.id),cards=$$('.item',grid),i=cards.indexOf(el);
  const cols=getComputedStyle(grid).gridTemplateColumns.split(' ').length;
  const go=j=>{if(cards[j]){e.preventDefault();cards[j].focus()}};
  switch(e.key){
    case 'Enter':case ' ':e.preventDefault();copyItem(it);break;
    case 'ArrowRight':go(i+1);break;
    case 'ArrowLeft':go(i-1);break;
    case 'ArrowDown':go(i+cols);break;
    case 'ArrowUp':if(i-cols<0){e.preventDefault();$('#q').focus()}else go(i-cols);break;
    case 'Home':go(0);break;
    case 'End':go(cards.length-1);break;
    case 'e':case 'E':e.preventDefault();openItem(it.id);break;
    case 'p':case 'P':e.preventDefault();togglePin(it);break;
    case 'Delete':case 'Backspace':e.preventDefault();delItem(it);break;
    default:return;
  }
  e.stopPropagation();
});

/* ---------- 拖曳：排序、拖到分類、拖到其他程式 ---------- */
let dragId=null,lastSwap=0,moved=false;
grid.addEventListener('dragstart',e=>{
  const el=e.target.closest('.item');if(!el)return;
  dragId=el.dataset.id;moved=false;
  const it=itemById(dragId);
  e.dataTransfer.effectAllowed='copyMove';
  e.dataTransfer.setData('text/plain',expand(it.content));
  e.dataTransfer.setData('application/x-clipbox',dragId);
  requestAnimationFrame(()=>el.classList.add('dragging'));
});
grid.addEventListener('dragover',e=>{
  if(!dragId||!canReorder())return;
  e.preventDefault();e.dataTransfer.dropEffect='move';
  const over=e.target.closest('.item'),me=cardOf(dragId);
  if(!over||over===me||!me||performance.now()-lastSwap<180)return;
  const cards=$$('.item',grid),a=cards.indexOf(me),b=cards.indexOf(over);
  lastSwap=performance.now();moved=true;
  flip(()=>over[a<b?'after':'before'](me));
});
grid.addEventListener('drop',e=>{if(dragId)e.preventDefault()});
grid.addEventListener('dragend',()=>{
  const me=cardOf(dragId);if(me)me.classList.remove('dragging');
  if(moved&&canReorder()){
    const ids=$$('.item',grid).map(el=>el.dataset.id);
    const set=new Set(ids),slots=[];
    db.items.forEach((it,i)=>{if(set.has(it.id))slots.push(i)});
    const ordered=ids.map(itemById);
    slots.forEach((s,k)=>db.items[s]=ordered[k]);
    save();render();
  }
  dragId=null;moved=false;
  $$('.cat.drop',catsEl).forEach(x=>x.classList.remove('drop'));
});
catsEl.addEventListener('dragover',e=>{
  const row=e.target.closest('.cat');
  if(!dragId||!row||row.dataset.cat==='all'||!row.dataset.cat)return;
  e.preventDefault();e.dataTransfer.dropEffect='move';
  $$('.cat.drop',catsEl).forEach(x=>x!==row&&x.classList.remove('drop'));row.classList.add('drop');
});
catsEl.addEventListener('dragleave',e=>{const row=e.target.closest('.cat');if(row&&!row.contains(e.relatedTarget))row.classList.remove('drop')});
catsEl.addEventListener('drop',e=>{
  const row=e.target.closest('.cat');if(!dragId||!row)return;
  e.preventDefault();row.classList.remove('drop');
  const it=itemById(dragId),k=row.dataset.cat;if(!it)return;
  moved=false;
  if(k==='pin'){if(!it.pin)togglePin(it);return}
  const to=k==='none'?null:k;
  if(it.cat===to)return;
  it.cat=to;save();flip(()=>render());
  toast(`已移到「${to?catById(to).name:'未分類'}」`,'check');
});

/* ---------- 事件：分類、排序、搜尋 ---------- */
catsEl.addEventListener('click',e=>{
  const ed=e.target.closest('[data-edit]');if(ed){e.stopPropagation();openCat(ed.dataset.edit);return}
  if(e.target.closest('[data-newcat]')){openCat(null);return}
  const row=e.target.closest('.cat');if(!row||row.dataset.cat===state.cat)return;
  state.cat=row.dataset.cat;save();render(true);
});
catsEl.addEventListener('dblclick',e=>{const row=e.target.closest('.cat');if(row&&catById(row.dataset.cat))openCat(row.dataset.cat)});
$('#addCat').addEventListener('click',()=>openCat(null));
$('#sort').addEventListener('click',e=>{
  const b=e.target.closest('[data-s]');if(!b||b.dataset.s===state.sort)return;
  state.sort=b.dataset.s;save();flip(()=>render());
});
const q=$('#q');
function syncSearch(){$('#srch').classList.toggle('has',!!q.value)}
q.addEventListener('input',()=>{state.q=q.value.trim();syncSearch();render()});
q.addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();const f=visible()[0];if(f)copyItem(f);else if(state.q)openItem(null,{title:state.q})}
  else if(e.key==='Escape'){e.preventDefault();e.stopPropagation();if(q.value){q.value='';state.q='';syncSearch();render()}else q.blur()}
  else if(e.key==='ArrowDown'){const f=$('.item',grid);if(f){e.preventDefault();f.focus()}}
});
$('#qclr').addEventListener('click',e=>{e.preventDefault();q.value='';state.q='';syncSearch();render();q.focus()});
$('#addBtn').addEventListener('click',()=>openItem(null));

/* ---------- 全域快捷鍵與貼上 ---------- */
const typing=el=>el&&(el.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
document.addEventListener('keydown',e=>{
  if(modal){
    if(e.key==='Escape'){e.preventDefault();closeModal()}
    else if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();modal.save()}
    else if(e.key==='Tab'){ // 焦點留在對話框內
      const f=$$('button,input,textarea',mdl).filter(x=>!x.disabled&&x.offsetParent);
      if(!f.length)return;
      const a=f[0],z=f[f.length-1];
      if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}
      else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}
    }
    return;
  }
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&e.key.toLowerCase()==='k'){e.preventDefault();q.focus();q.select();return}
  if(typing(e.target)||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='/'){e.preventDefault();q.focus();q.select()}
  else if(e.key==='n'||e.key==='N'){e.preventDefault();openItem(null)}
  else if(/^[1-9]$/.test(e.key)){const it=visible()[+e.key-1];if(it){e.preventDefault();copyItem(it)}}
  else if(e.key==='Escape'&&state.q){q.value='';state.q='';syncSearch();render()}
});
document.addEventListener('paste',e=>{
  if(modal||typing(e.target))return;
  const t=e.clipboardData&&e.clipboardData.getData('text/plain');
  if(!t||!t.trim())return;
  e.preventDefault();
  const dup=db.items.find(i=>i.content===t);
  if(dup){toast(`這段內容已經存在：「${titleOf(dup)}」`,'clip',{ms:2600});const el=cardOf(dup.id);if(el){el.scrollIntoView({block:'nearest'});el.classList.remove('flash');el.offsetWidth;el.classList.add('flash')}return}
  openItem(null,{content:t});
});

/* ---------- 匯出／匯入 ---------- */
$('#expBtn').addEventListener('click',()=>{
  const d=new Date(),data={app:'clipbox',version:1,exported:d.toISOString(),cats:db.cats,items:db.items};
  const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  const a=document.createElement('a');a.href=url;a.download=`clipboard-backup-${VARS.date(d)}.json`;document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  toast(`已匯出 ${db.items.length} 則`,'down');
});
$('#impBtn').addEventListener('click',()=>$('#impFile').click());
$('#impFile').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  let d;
  try{d=normalize(JSON.parse(await f.text()))}catch(err){d=null}
  if(!d||(!d.items.length&&!d.cats.length)){toast('看不懂這個檔案，請選擇匯出的 .json 備份','x',{bad:true,ms:3000});return}
  const map={};
  d.cats.forEach(c=>{let m=db.cats.find(x=>x.name===c.name);if(!m){m={id:uid(),name:c.name,color:c.color};db.cats.push(m)}map[c.id]=m.id});
  let add=0,skip=0;
  d.items.forEach(i=>{
    if(db.items.some(x=>x.content===i.content&&x.title===i.title)){skip++;return}
    db.items.push({...i,id:uid(),cat:i.cat?map[i.cat]||null:null});add++;
  });
  save();render(true);
  toast(`已匯入 ${add} 則${skip?`，略過重複 ${skip} 則`:''}`,'up',{ms:3000});
});

/* ---------- 其他 ---------- */
addEventListener('storage',e=>{if(e.key===KEY&&e.newValue&&!modal){try{const d=normalize(JSON.parse(e.newValue));if(d){db=d;seeded=false;render()}}catch(err){}}});
addEventListener('resize',()=>movePill(true));
setInterval(()=>{if(!modal&&!dragId&&document.visibilityState==='visible')$$('.item',grid).forEach(el=>{const it=itemById(el.dataset.id);if(it)$('.meta',el).innerHTML=metaHTML(it)})},60000);

if(MOD==='⌘')$$('.keys kbd').forEach(k=>{if(k.textContent==='Ctrl')k.textContent='⌘'});
try{localStorage.setItem(KEY+'.test','1');localStorage.removeItem(KEY+'.test')}catch(e){storageOK=false}
load();render(true);
if(!storageOK)save();
