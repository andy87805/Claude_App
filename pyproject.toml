[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mediaconv"
version = "0.1.0"
description = "照片、影片批次格式轉換與壓縮（含 PDF）命令列工具"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Pillow>=11.3",
    "pillow-heif>=0.18",
    "tqdm>=4.60",
    "imageio-ffmpeg>=0.5",
    "pikepdf>=8",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mediaconv = "mediaconv.cli:main"

[tool.setuptools]
packages = ["mediaconv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
