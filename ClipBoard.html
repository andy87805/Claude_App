<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>常用剪貼簿</title>
<link rel="icon" type="image/svg+xml" sizes="any" href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"%3E%3Crect width="512" height="512" rx="112" fill="%230c0c0d"/%3E%3Crect x="104" y="104" width="304" height="360" rx="56" fill="%23fff"/%3E%3Crect x="168" y="56" width="176" height="104" rx="40" fill="%232bd96b" stroke="%230c0c0d" stroke-width="24" paint-order="stroke"/%3E%3Crect x="164" y="236" width="184" height="48" rx="24" fill="%230c0c0d"/%3E%3Crect x="164" y="328" width="120" height="48" rx="24" fill="%232bd96b"/%3E%3C/svg%3E'>
<style>
:root{
  --bg:#ebebed; --card:#fff; --ink:#0c0c0d; --on-ink:#fff; --accent:#2bd96b;
  --mute:rgba(12,12,13,.46); --line:rgba(12,12,13,.09); --soft:rgba(12,12,13,.055);
  --field:#fff; --danger:#e5484d; --hover-shadow:0 10px 26px rgba(0,0,0,.07);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --bounce:cubic-bezier(.3,1.35,.5,1);
  --smooth:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
}
@supports (transition-timing-function:linear(0,1)){
  :root{--spring:linear(0,.009,.035 2.1%,.141 4.4%,.723 12.9%,.938 16.7%,1.017,1.077,1.121,1.149 24.3%,1.159,1.163,1.161,1.154 29.9%,1.129 32.8%,1.051 39.6%,1.017 43.1%,.991,.977 51%,.974 53.8%,.975 57.1%,.997 69.8%,1.003 76.9%,1.004 83.8%,1)}
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b0b0c; --card:#1a1a1d; --ink:#f4f4f5; --on-ink:#0c0c0d;
    --mute:rgba(244,244,245,.5); --line:rgba(255,255,255,.1); --soft:rgba(255,255,255,.07);
    --field:#242428; --danger:#ff6b6f; --hover-shadow:0 10px 26px rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0b0c; --card:#1a1a1d; --ink:#f4f4f5; --on-ink:#0c0c0d;
  --mute:rgba(244,244,245,.5); --line:rgba(255,255,255,.1); --soft:rgba(255,255,255,.07);
  --field:#242428; --danger:#ff6b6f; --hover-shadow:0 10px 26px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{font:500 14px/1.4 "Inter","SF Pro Text","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;padding:28px 20px 96px;user-select:none;cursor:default;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{user-select:text}
.page{max-width:1240px;margin:0 auto}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
kbd{font:600 11px/1 inherit;font-family:inherit;color:var(--mute);background:var(--card);border-radius:6px;padding:4px 6px;box-shadow:0 0 0 1px var(--line);white-space:nowrap}
.lbl{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.04em;margin-bottom:12px;min-height:16px}
.card{background:var(--card);border-radius:28px;padding:20px;position:relative;min-width:0}

/* header */
header{display:flex;align-items:center;gap:12px;padding:6px 6px 22px;flex-wrap:wrap}
header .ttl{flex:1;min-width:180px}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
h1 .logo{width:30px;height:30px;border-radius:9px;flex:none;box-shadow:0 0 0 1px var(--line),0 4px 12px rgba(0,0,0,.12)}
header p{color:var(--mute);font-size:13px;margin-top:2px}
.srch{display:flex;align-items:center;gap:8px;height:44px;width:min(380px,100%);border-radius:14px;background:var(--card);padding:0 8px 0 12px;border:1.5px solid transparent;transition:border-color .3s,box-shadow .3s}
.srch:focus-within{border-color:var(--ink)}
.srch .ic{color:var(--mute)}
.srch input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-weight:600;color:var(--ink);height:100%}
.srch input::placeholder{color:var(--mute);font-weight:500}
.srch input::-webkit-search-cancel-button{display:none}
.srch .clr{width:26px;height:26px;border-radius:8px;display:none;place-items:center;color:var(--mute)}
.srch.has .clr{display:grid}
.srch.has kbd{display:none}
.srch .clr .ic{width:14px;height:14px}

.btn{height:44px;border-radius:14px;background:var(--ink);color:var(--on-ink);padding:0 16px 0 13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:transform .45s var(--spring),background .3s,color .3s,box-shadow .3s;flex:none}
.btn:active,.tap{transform:scale(.92)!important}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.line{background:none;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.danger{background:none;color:var(--danger);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.danger.arm{background:var(--danger);color:#fff;box-shadow:none}
.btn.sm{height:36px;border-radius:12px;padding:0 12px;font-size:13px}
.btn kbd{background:none;box-shadow:0 0 0 1px currentColor;color:inherit;opacity:.5;padding:3px 5px}

/* layout */
.layout{display:grid;grid-template-columns:248px minmax(0,1fr);gap:16px;align-items:start}
aside{position:sticky;top:20px;display:flex;flex-direction:column;gap:16px}
.lbl .add{width:26px;height:26px;border-radius:9px;background:var(--soft);display:grid;place-items:center;color:var(--ink);transition:transform .45s var(--spring),background .3s}
.lbl .add:hover{background:var(--ink);color:var(--on-ink)}
.lbl .add .ic{width:14px;height:14px;stroke-width:2.6}

.cats{position:relative;display:flex;flex-direction:column;gap:2px;margin:0 -8px}
.cat-pill{position:absolute;left:0;right:0;top:0;height:42px;border-radius:14px;background:var(--ink);transition:transform .7s var(--spring),height .4s var(--smooth);pointer-events:none}
.cat-pill.still{transition:none}
.cat{position:relative;z-index:1;display:flex;align-items:center;gap:10px;height:42px;padding:0 8px 0 12px;border-radius:14px;font-weight:600;cursor:pointer;transition:color .3s,background .25s,box-shadow .25s;text-align:left;width:100%}
.cat:not(.on):hover{background:var(--soft)}
.cat.on{color:var(--on-ink)}
.cat.drop{box-shadow:inset 0 0 0 2px var(--accent);background:rgba(43,217,107,.12)}
.cat[draggable="true"]{cursor:grab}
.cat[draggable="true"]:active{cursor:grabbing}
.cat.dragging{opacity:.35}
.cats.sorting .cat:not(.dragging):hover{background:none}
.cat .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;margin:0 4px}
.cat .ic{width:18px;height:18px}
.cat .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat .n{font-size:12px;color:var(--mute);min-width:18px;text-align:right;transition:opacity .2s}
.cat.on .n{color:inherit;opacity:.55}
.cat .ed{width:0;height:26px;border-radius:8px;display:grid;place-items:center;overflow:hidden;opacity:0;transition:width .35s var(--spring),opacity .2s,background .2s;flex:none}
.cat .ed .ic{width:14px;height:14px}
.cat:hover .ed,.cat:focus-visible .ed{width:26px;opacity:1}
.cat .ed:hover{background:var(--soft)}
.cat.on .ed:hover{background:rgba(127,127,127,.25)}
.sep{height:1px;background:var(--line);margin:6px 12px}

.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tools .btn{padding:0 10px}
.tools .btn .ic{width:16px;height:16px}
.note{font-size:12px;color:var(--mute);margin-top:12px;line-height:1.5}
.bk{border-radius:16px;background:var(--soft);padding:12px;margin-bottom:10px;font-size:12px;line-height:1.5}
.bk .st{display:flex;align-items:flex-start;gap:8px;font-weight:600;color:var(--ink)}
.bk .st>i{width:8px;height:8px;border-radius:50%;background:var(--mute);flex:none;margin-top:5px}
.bk.ok .st>i{background:var(--accent);box-shadow:0 0 0 3px rgba(43,217,107,.2)}
.bk.wait .st>i{background:#f5b34a;box-shadow:0 0 0 3px rgba(245,179,74,.2)}
.bk.bad .st>i{background:var(--danger)}
.bk.bad .st{color:var(--danger)}
.bk .st b{font-weight:700;word-break:break-all}
.bk small{display:block;color:var(--mute);font-weight:500;margin-top:2px}
.bk .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.bk .acts .btn{flex:1}
.link{font-size:12px;font-weight:600;color:var(--mute);text-decoration:underline;text-underline-offset:3px;margin-top:10px;display:inline-flex;align-items:center;gap:5px}
.link:hover{color:var(--ink)}
.link .ic{width:14px;height:14px}
.steps{list-style:none;counter-reset:st;display:flex;flex-direction:column;gap:14px;margin-bottom:4px}
.steps li{counter-increment:st;display:flex;gap:12px;line-height:1.6}
.steps li::before{content:counter(st);width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;margin-top:1px}
.steps li>div{flex:1;min-width:0}
.steps b{font-weight:700}
.cmd{display:flex;align-items:center;gap:8px;margin-top:8px;background:var(--soft);border-radius:12px;padding:8px 8px 8px 12px}
.cmd code{flex:1;min-width:0;font:12px/1.5 ui-monospace,Consolas,monospace;word-break:break-all;user-select:all}
.cmd .btn{flex:none}
.tip{margin-top:14px;padding:12px 14px;border-radius:14px;box-shadow:inset 0 0 0 1.5px var(--line);font-size:12px;color:var(--mute);line-height:1.7}
.tip b{color:var(--ink)}
.tip.warn{box-shadow:inset 0 0 0 1.5px var(--danger);color:var(--danger)}
.note.warn{color:var(--danger);font-weight:600}
.keys{display:flex;flex-direction:column;gap:9px;font-size:12px;color:var(--mute)}
.keys div{display:flex;align-items:center;justify-content:space-between;gap:8px}
.keys span{display:flex;gap:3px}

/* toolbar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 4px 14px;flex-wrap:wrap}
.bar h2{font-size:18px;font-weight:700;display:flex;align-items:baseline;gap:8px;min-width:0}
.bar h2 small{font-size:13px;font-weight:600;color:var(--mute)}
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:14px;padding:4px;min-width:228px}
.seg button{position:relative;z-index:1;text-align:center;padding:7px 12px;font-size:13px;font-weight:600;color:var(--mute);transition:color .3s}
.seg button.on{color:var(--ink)}
.seg-pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:10px;background:var(--soft);box-shadow:inset 0 0 0 1.5px var(--line);transition:transform .7s var(--spring)}

/* grid of snippets */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.item{background:var(--card);border-radius:24px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px;position:relative;cursor:pointer;outline:0;transition:transform .5s var(--spring),box-shadow .3s,opacity .2s;min-width:0}
.item:hover{transform:translateY(-3px);box-shadow:var(--hover-shadow)}
.item:focus-visible{box-shadow:0 0 0 2px var(--ink),var(--hover-shadow)}
.item.enter{animation:rise .75s var(--bounce) both;animation-delay:calc(min(var(--i,0),14)*35ms)}
.item.pop{animation:pop .6s var(--spring) both}
.item.dragging{opacity:.35;transform:scale(.97)}
.item::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 2px var(--accent);opacity:0;pointer-events:none}
.item.flash::after{animation:flash .9s var(--smooth)}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.96)}}
@keyframes pop{from{opacity:0;transform:scale(.85)}}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.it-h{display:flex;align-items:center;gap:8px;min-height:26px}
.it-t{font-weight:700;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it-cat{font-size:11px;font-weight:600;color:var(--mute);display:inline-flex;align-items:center;gap:5px;flex:none;max-width:40%;white-space:nowrap;overflow:hidden}
.it-cat i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.it-k{font-size:10px;padding:3px 5px}
.pin{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--mute);flex:none;margin-right:-4px;transition:color .2s,background .2s}
.pin:hover{background:var(--soft);color:var(--ink)}
.pin .ic{width:16px;height:16px;transition:transform .55s var(--spring),fill .2s}
.pin.on{color:var(--accent)}
.pin.on .ic{fill:var(--accent);transform:rotate(-8deg) scale(1.08)}
.item:not(:hover):not(:focus-within) .pin:not(.on){opacity:0}
.it-c{background:var(--soft);border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.55;min-height:42px}
.it-c>.tx{white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;max-height:calc(1.55em*4)}
.it-c.priv{letter-spacing:3px;color:var(--mute)}
.it-c a.lk{color:inherit;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:3px;border-radius:4px;cursor:pointer;transition:background .2s}
.it-c a.lk:hover{background:rgba(43,217,107,.2)}
.it-c a.lk .ic{width:13px;height:13px;vertical-align:-2px;margin-right:3px}
.it-c.lines{padding:4px;display:flex;flex-direction:column;gap:2px;letter-spacing:0;color:inherit}
.ln{display:flex;align-items:center;gap:8px;min-height:34px;padding:4px 4px 4px 10px;border-radius:10px;cursor:pointer;outline:0;transition:background .2s,color .2s,box-shadow .2s}
.ln:hover{background:var(--card)}
.ln:focus-visible{background:var(--card);box-shadow:0 0 0 2px var(--ink)}
.ln .k{font-size:12px;color:var(--mute);flex:none;max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ln .v{flex:1;min-width:0;overflow:hidden;font-size:13px;font-weight:600;line-height:1.4;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.priv .ln .v{letter-spacing:2px;color:var(--mute);font-weight:500}
.ln .lc{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--mute);flex:none;opacity:0;transition:opacity .2s}
.ln .lc .ic{width:14px;height:14px;grid-area:1/1;transition:transform .45s var(--spring),opacity .2s}
.ln .lc .ok{transform:scale(0);opacity:0;stroke-width:3}
.ln:hover .lc,.ln:focus-visible .lc{opacity:1}
.ln .lo{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--ink);flex:none;transition:background .2s,color .2s}
.ln .lo:hover{background:var(--accent);color:#0c0c0d}
.ln .lo .ic{width:14px;height:14px}
.ln.done{background:var(--accent);color:#0c0c0d}
.ln.done .k,.ln.done .v{color:#0c0c0d}
.ln.done .lc{opacity:1;color:#0c0c0d}
.ln.done .lc .ic:first-child{transform:scale(0);opacity:0}
.ln.done .lc .ok{transform:none;opacity:1}
.more{height:30px;border-radius:10px;font-size:12px;font-weight:600;color:var(--mute);transition:background .2s,color .2s}
.more:hover{background:var(--card);color:var(--ink)}
.it-c .var{background:var(--card);box-shadow:0 0 0 1px var(--line);border-radius:6px;padding:0 4px;font-size:12px;font-weight:600}
mark{background:rgba(43,217,107,.38);color:inherit;border-radius:3px;padding:0 1px}
.it-f{display:flex;align-items:center;gap:6px;margin-top:auto}
.it-f small{color:var(--mute);font-size:12px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.it-f small .ic{width:13px;height:13px}
.ib{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--mute);transition:opacity .2s,background .2s,color .2s,transform .45s var(--spring);flex:none}
.ib:hover{background:var(--soft);color:var(--ink)}
.ib.del:hover{color:var(--danger)}
.ib .ic{width:16px;height:16px}
.ib.op{opacity:1!important;color:var(--ink);background:var(--soft)}
.ib.op:hover{background:var(--accent);color:#0c0c0d}
.ib.rows.on{opacity:1!important;color:var(--ink);background:var(--soft)}
.item:not(:hover):not(:focus-within) .ib{opacity:0}
.cp{height:36px;min-width:92px;border-radius:12px;background:var(--ink);color:var(--on-ink);position:relative;overflow:hidden;font-weight:700;font-size:13px;flex:none;transition:background .35s,color .35s,transform .45s var(--spring)}
.cp span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .55s var(--spring),opacity .2s}
.cp .ic{width:15px;height:15px}
.cp .s2{transform:translateY(100%);opacity:0}
.cp .s2 .ic{stroke-width:3}
.cp.done{background:var(--accent);color:#0c0c0d;animation:hopS .55s var(--spring)}
.cp.done .s1{transform:translateY(-100%);opacity:0}
.cp.done .s2{transform:none;opacity:1}
@keyframes hopS{35%{transform:scale(1.06)}}

.empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:48px 20px;animation:rise .7s var(--bounce) both}
.empty>i{width:64px;height:64px;border-radius:20px;background:var(--soft);display:grid;place-items:center;margin-bottom:4px}
.empty>i .ic{width:28px;height:28px}
.empty strong{font-size:17px}
.empty p{color:var(--mute);font-size:13px;max-width:340px;line-height:1.6}
.empty .btn{margin-top:8px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(12,12,13,.34);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;opacity:0;transition:opacity .25s;z-index:50}
.ov.open{opacity:1}
.ov[hidden]{display:none}
.mdl{width:min(580px,100%);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:auto;background:var(--card);border-radius:28px;padding:22px;transform:scale(.92) translateY(16px);transition:transform .6s var(--spring);box-shadow:0 30px 80px rgba(0,0,0,.25)}
.ov.open .mdl{transform:none}
.mdl.shake{animation:shake .45s var(--smooth)}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.mdl h3{font-size:18px;font-weight:700;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between}
.mdl h3 .x{width:32px;height:32px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.mdl h3 .x .ic{width:15px;height:15px}
.fld{margin-bottom:16px}
.fld .lbl{margin-bottom:8px}
.fld .lbl b{color:var(--mute);font-weight:500;letter-spacing:0}
.inp{width:100%;height:46px;border-radius:14px;background:var(--soft);border:1.5px solid transparent;padding:0 14px;font:inherit;font-weight:600;color:var(--ink);outline:0;transition:border-color .25s,background .25s}
.inp::placeholder{color:var(--mute);font-weight:500}
.inp:focus{border-color:var(--ink);background:var(--field)}
.inp.bad{border-color:var(--danger)}
textarea.inp{height:150px;min-height:110px;max-height:46vh;padding:12px 14px;resize:vertical;line-height:1.55;font-weight:500;display:block}
.hint{font-size:12px;color:var(--mute);margin-top:8px;line-height:1.7}
.hint code{font:600 11px/1 inherit;font-family:inherit;background:var(--soft);border-radius:6px;padding:3px 6px;color:var(--ink);cursor:pointer;display:inline-block;margin:1px 0;transition:background .2s}
.hint code:hover{background:var(--accent);color:#0c0c0d}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:99px;box-shadow:inset 0 0 0 1.5px var(--line);font-size:13px;font-weight:600;transition:background .3s,color .3s,box-shadow .3s,transform .4s var(--spring)}
.tag i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tag .ic{width:0;height:14px;margin-right:-6px;opacity:0;stroke-width:3;transition:width .45s var(--spring),margin .45s var(--spring),opacity .2s}
.tag.on{background:var(--ink);color:var(--on-ink);box-shadow:none}
.tag.on .ic{width:14px;margin-right:0;opacity:1;color:var(--accent)}
.tag.on i{display:none}
.tag.new{color:var(--mute);box-shadow:inset 0 0 0 1.5px var(--line);border:0}
.tag.new .ic{width:14px;opacity:1;margin:0;stroke-width:2.4}
.tag input{width:110px;border:0;outline:0;background:none;font:inherit;color:var(--ink)}
.tag.edit{box-shadow:inset 0 0 0 2px var(--ink)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:16px;box-shadow:inset 0 0 0 1.5px var(--line);cursor:pointer}
.row div{font-weight:600}
.row small{display:block;color:var(--mute);font-size:12px;font-weight:500}
.sw{width:48px;height:28px;border-radius:14px;background:rgba(127,127,127,.28);position:relative;transition:background .35s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .6s var(--spring)}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(20px)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:32px;height:32px;border-radius:50%;background:var(--c);box-shadow:0 0 0 0 var(--ink);transition:box-shadow .3s,transform .45s var(--spring)}
.swatches button.on{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--ink);transform:scale(1.05)}
.mf{display:flex;align-items:center;gap:8px;margin-top:20px;flex-wrap:wrap}
.mf .sp{flex:1}
.cnt{font-size:12px;color:var(--mute)}

/* toasts */
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:60;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;background:#0c0c0d;color:#fff;border-radius:18px;padding:8px 14px 8px 8px;box-shadow:0 14px 34px rgba(0,0,0,.25),0 0 0 1px rgba(255,255,255,.08);font-size:13px;font-weight:600;animation:tin .6s var(--spring) both;max-width:100%}
.toast>i{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#0c0c0d;display:grid;place-items:center;flex:none}
.toast>i.bad{background:#ff6b6f}
.toast>i .ic{width:16px;height:16px;stroke-width:2.6}
.toast span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast small{display:block;font-size:11px;font-weight:500;opacity:.62;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.toast button{margin-left:6px;margin-right:-6px;height:30px;padding:0 12px;border-radius:10px;background:rgba(255,255,255,.14);color:#fff;font-weight:700;font-size:13px;flex:none}
.toast button:hover{background:var(--accent);color:#0c0c0d}
.toast.out{animation:tout .3s var(--smooth) forwards}
@keyframes tin{from{opacity:0;transform:translateY(24px) scale(.9)}}
@keyframes tout{to{opacity:0;transform:translateY(10px) scale(.94)}}

@media (hover:none){

<script>
'use strict';
const $=(s,e=document)=>e.querySelector(s), $$=(s,e=document)=>[...e.querySelectorAll(s)];
const ic=(n,c='')=>`<svg class="ic ${c}"><use href="#${n}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const reduce=matchMedia('(prefers-reduced-motion: reduce)');
const KEY='clipbox.v1';
const COLORS=['#2bd96b','#4a8cff','#ff9f43','#ff5c7a','#a66bff','#16c1c8','#f2c94c','#8a8a8e'];

/* ---------- 資料 ---------- */
let db, storageOK=true;
const state={cat:'all',q:'',sort:'manual'};

function seed(){
  const c=[['常用回覆','#2bd96b'],['個人資料','#4a8cff'],['工作','#ff9f43'],['程式指令','#a66bff']].map(([name,color])=>({id:uid(),name,color}));
  const now=Date.now();
  const it=(cat,title,content,o={})=>({id:uid(),title,content,cat:c[cat].id,pin:false,priv:false,count:0,last:0,created:now,...o});
  return {v:1,cats:c,prefs:{sort:'manual',cat:'all'},items:[
    it(0,'收到，稍後回覆','收到，我現在不方便，稍後再回覆你 🙏',{pin:true}),
    it(0,'感謝來信','您好，謝謝您的來信！\n相關資料我已收到，會在 {{date}} 下班前回覆您。\n\n祝 順心'),
    it(1,'電子郵件','your.name@example.com'),
    it(1,'基本資料','姓名：王小明\n電話：0912-345-678\nEmail：your.name@example.com\n地址：（請改成你的地址）台北市○○區○○路 1 號 10 樓',{lines:true}),
    it(1,'銀行帳號','（822）1234-5678-9012',{priv:true}),
    it(2,'工作日報','【{{date}}（{{weekday}}）工作日報】\n✅ 今日完成：\n🔜 明日計畫：\n⚠️ 需要協助：'),
    it(2,'共用資料夾',IS_MAC?'/Users/Shared':'C:\\Users\\Public\\Documents'),
    it(2,'會議連結','會議時間：{{date}} {{time}}\n連結：https://meet.example.com/abc-defg-hij'),
    it(3,'Git 一次提交','git add -A && git commit -m "更新" && git push'),
    it(3,'本機網頁伺服器','python3 -m http.server 8000'),
  ]};
}
function normalize(d){
  if(!d||typeof d!=='object')return null;
  d.cats=Array.isArray(d.cats)?d.cats.filter(c=>c&&c.id&&typeof c.name==='string'):[];
  d.items=Array.isArray(d.items)?d.items.filter(i=>i&&i.id&&typeof i.content==='string'):[];
  d.items.forEach(i=>{i.title=typeof i.title==='string'?i.title:'';i.count=+i.count||0;i.last=+i.last||0;i.created=+i.created||Date.now();i.pin=!!i.pin;i.priv=!!i.priv;i.lines=!!i.lines;if(i.cat&&!d.cats.some(c=>c.id===i.cat))i.cat=null});
  d.cats.forEach((c,k)=>{if(!c.color)c.color=COLORS[k%COLORS.length]});
  d.prefs=Object.assign({sort:'manual',cat:'all'},d.prefs||{});
  return d;
}
// seeded：目前顯示的是範例資料、還沒寫入過。這時候絕不覆蓋儲存區裡已有的資料
let seeded=false;
function readStored(){
  let raw=null;
  try{raw=localStorage.getItem(KEY)}catch(e){storageOK=false}
  if(!raw)return null;
  try{const d=normalize(JSON.parse(raw));if(d)return d}catch(e){}
  // 資料壞掉時先另存一份，避免被覆蓋後救不回來
  try{localStorage.setItem(KEY+'.corrupt-'+Date.now(),raw)}catch(e){}
  return null;
}
function applyPrefs(){
  state.sort=['manual','used','recent'].includes(db.prefs.sort)?db.prefs.sort:'manual';
  state.cat=db.prefs.cat||'all';
}
function load(){
  db=readStored();
  seeded=!db;
  if(!db)db=seed();
  applyPrefs();
}
function save(){
  if(seeded){
    const stored=readStored();
    if(stored){ // 儲存區其實有資料（例如瀏覽器較晚才讀到）→ 改用它，不覆蓋
      db=stored;seeded=false;applyPrefs();render();
      toast('已載入先前儲存的資料','check',{ms:2600});
      return false;
    }
    seeded=false;
  }
  db.prefs.sort=state.sort;db.prefs.cat=state.cat;
  try{localStorage.setItem(KEY,JSON.stringify(db));storageOK=true}catch(e){storageOK=false}
  const n=$('#note');
  if(!storageOK){n.classList.add('warn');n.textContent='這個瀏覽器不允許儲存資料，關閉頁面後內容會消失，請記得用「匯出」備份。'}
  backupCheck();
  return true;
}

const catById=id=>db.cats.find(c=>c.id===id);
const firstLine=s=>(s.split('\n').find(l=>l.trim())||'').trim();
const titleOf=it=>it.title.trim()||firstLine(it.content).slice(0,40)||'（空白）';

/* ---------- 變數 ---------- */
const pad=n=>String(n).padStart(2,'0');
const VARS={
  date:d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,
  time:d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`,
  weekday:d=>'星期'+'日一二三四五六'[d.getDay()],
};
VARS['日期']=VARS.date;VARS['時間']=VARS.time;VARS['星期']=VARS.weekday;
const VAR_RE=/\{\{\s*(date|time|weekday|日期|時間|星期)\s*\}\}/g;
const VAR_LABEL={date:'日期',time:'時間',weekday:'星期'};
const MOD=/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent)?'⌘':'Ctrl';
const IS_MAC=MOD==='⌘', IS_WIN=/Win/i.test(navigator.platform||navigator.userAgent);
/* ---------- 連結與路徑 ---------- */
const URL_PART=/((?:https?:\/\/|www\.)[^\s<>"'，。；、！？）)\]】」』]+)/i;
const UNIX_ROOT=/^\/(Users|Volumes|home|mnt|media|tmp|opt|var|etc|srv|Applications|Library|private)(\/|$)/;
const unq=s=>s.trim().replace(/^"(.+)"$/,'$1').replace(/^'(.+)'$/,'$1');
// 整段文字是不是一個網址／資料夾／檔案；是的話回傳 {kind,url}
function linkOf(str){
  const s=unq(str);if(!s||s.includes('\n'))return null;
  if(/^(https?:\/\/|www\.)\S+$/i.test(s))return {kind:'web',url:/^www\./i.test(s)?'https://'+s:s};
  let url=null;
  if(/^file:\/\/\S/i.test(s))url=s.replace(/ /g,'%20');
  else if(/^[a-zA-Z]:[\\/]/.test(s))url='file:///'+s[0].toUpperCase()+':/'+s.slice(3).split(/[\\/]/).map(encodeURIComponent).join('/');
  else if(/^\\\\[^\\\s]+\\/.test(s)){const [host,...rest]=s.slice(2).split('\\');url='file://'+host+'/'+rest.map(encodeURIComponent).join('/')}
  else if(UNIX_ROOT.test(s))url='file://'+s.split('/').map(encodeURIComponent).join('/');
  if(!url)return null;
  const last=s.replace(/[\\/]+$/,'').split(/[\\/]/).pop();
  return {kind:!/[\\/]$/.test(s)&&/\.[a-z0-9]{1,8}$/i.test(last)?'file':'folder',url};
}
const firstURL=s=>{const m=s.match(URL_PART);return m?linkOf(m[1]):null};
const KIND={web:['ext','開啟網頁'],folder:['folder','在瀏覽器開啟這個資料夾'],file:['file','在瀏覽器開啟這個檔案']};
const linkAttrs=L=>`href="${esc(L.url)}" target="_blank" rel="noopener noreferrer" data-kind="${L.kind}" title="${KIND[L.kind][1]}"`;
// 「名稱：內容」→ {k,v}；網址、時間（10:30）、磁碟代號（C:\）不算
function splitLabel(line){
  const m=line.match(/^\s*([^:：\n]{1,20}?)\s*(?:：|:\s)\s*(\S.*)$/);
  if(!m)return null;
  const k=m[1].trim();
  if(!k||/^\d+$/.test(k)||/^[a-zA-Z]$/.test(k)||/(https?|www|file)$/i.test(k))return null;
  return {k,v:m[2].trim()};
}
const linesOf=text=>text.split('\n').map((raw,i)=>({raw,i})).filter(l=>l.raw.trim());
// 每一行都是「名稱：內容」或連結 → 建議用逐行模式
function suggestLines(text){const ls=linesOf(text);return ls.length>=2&&ls.every(l=>splitLabel(l.raw)||linkOf(l.raw))}
// 複製本機路徑後，告訴使用者怎麼用檔案總管／Finder 開
function pathTip(text){
  const L=linkOf(text);if(!L||L.kind==='web')return '';
  if(IS_MAC)return '在 Finder 按 ⌘⇧G 貼上，就能前往這個位置';
  if(IS_WIN||/^[a-zA-Z]:|^\\\\/.test(unq(text)))return '按 Win+R → 貼上 → Enter，就能用檔案總管開啟';
  return '';
}
const expand=s=>{const d=new Date();return s.replace(VAR_RE,(_,k)=>VARS[k](d))};

/* ---------- 剪貼簿 ---------- */
async function writeClip(text){
  if(navigator.clipboard&&window.isSecureContext){
    try{await navigator.clipboard.writeText(text);return true}catch(e){}
  }
  const active=document.activeElement;
  const ta=document.createElement('textarea');
  ta.value=text;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0;pointer-events:none';
  document.body.append(ta);ta.select();ta.setSelectionRange(0,text.length);
  let ok=false;try{ok=document.execCommand('copy')}catch(e){}
  ta.remove();if(active&&active.focus)active.focus({preventScroll:true});
  return ok;
}

/* ---------- 篩選與排序 ---------- */
const terms=()=>state.q.toLowerCase().split(/\s+/).filter(Boolean);
function inCat(it,cat){
  if(cat==='all')return true;
  if(cat==='pin')return it.pin;
  if(cat==='none')return !it.cat;
  return it.cat===cat;
}
function visible(){
  const t=terms();
  let list=db.items.filter(it=>inCat(it,state.cat));
  if(t.length)list=list.filter(it=>{
    const hay=(it.title+'\n'+(it.priv?'':it.content)+'\n'+(catById(it.cat)?.name||'')).toLowerCase();
    return t.every(w=>hay.includes(w));
  });
  const idx=new Map(db.items.map((it,i)=>[it.id,i]));
  const by={manual:(a,b)=>idx.get(a.id)-idx.get(b.id),used:(a,b)=>b.count-a.count||b.last-a.last||idx.get(a.id)-idx.get(b.id),recent:(a,b)=>b.last-a.last||idx.get(a.id)-idx.get(b.id)}[state.sort];
  return list.sort((a,b)=>(b.pin-a.pin)||by(a,b));
}
const canReorder=()=>state.sort==='manual'&&!state.q;

/* ---------- 文字標示 ---------- */
function hl(text,t){
  let h;
  if(!t.length)h=esc(text);
  else{
    const re=new RegExp('('+t.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');
    h=text.split(re).map((p,i)=>i%2?`<mark>${esc(p)}</mark>`:esc(p)).join('');
  }
  return h;
}
// 先標示搜尋字，再把 {{變數}} 包成小標籤（變數不含 HTML 字元，可直接在跳脫後的字串上取代）
const txtHTML=(s,t)=>hl(s,t).replace(/\{\{\s*(date|time|weekday|日期|時間|星期)\s*\}\}/g,(m,k)=>`<span class="var">${VAR_LABEL[k]||k}</span>`);
function richLine(line,t){
  const lab=splitLabel(line),val=lab?lab.v:line.trim(),L=linkOf(expand(val));
  if(L&&L.kind!=='web'){ // 整行（或冒號後）是本機路徑
    const at=line.lastIndexOf(val);
    return txtHTML(line.slice(0,at),t)+`<a class="lk" ${linkAttrs(L)}>${ic(KIND[L.kind][0])}${txtHTML(val,t)}</a>`+txtHTML(line.slice(at+val.length),t);
  }
  return line.split(URL_PART).map((p,i)=>{
    if(!(i%2))return txtHTML(p,t);
    const U=linkOf(expand(p));
    return U?`<a class="lk" ${linkAttrs(U)}>${txtHTML(p,t)}</a>`:txtHTML(p,t);
  }).join('');
}
const MAXL=6, expanded=new Set();
function linesHTML(it,t){
  const ls=linesOf(it.content),open=expanded.has(it.id);
  return (open?ls:ls.slice(0,MAXL)).map(l=>{
    const lab=splitLabel(l.raw),val=lab?lab.v:l.raw.trim();
    const L=it.priv?null:(linkOf(expand(val))||firstURL(expand(val)));
    const v=it.priv?'•'.repeat(Math.min(10,Math.max(5,val.length))):txtHTML(val,t);
    const tip=lab?`點一下複製「${esc(lab.k)}」的內容，Shift＋點一下複製整行`:'點一下複製這一行';
    return `<div class="ln" data-line="${l.i}" tabindex="0" title="${tip}">${lab?`<span class="k">${hl(lab.k,t)}</span>`:''}<span class="v">${v}</span>${L?`<a class="lo" ${linkAttrs(L)}>${ic(KIND[L.kind][0])}</a>`:''}<i class="lc">${ic('copy')}${ic('check','ok')}</i></div>`;
  }).join('')+(ls.length>MAXL?`<button class="more" type="button" data-act="more">${open?'收合':`還有 ${ls.length-MAXL} 行`}</button>`:'');
}
function previewHTML(it,t){
  if(it.lines&&linesOf(it.content).length>1)return linesHTML(it,t);
  if(it.priv)return '•'.repeat(Math.min(14,Math.max(6,it.content.length)));
  return it.content.split('\n').map(l=>richLine(l,t)).join('\n');
}
function ago(ts){
  if(!ts)return '';
  const s=(Date.now()-ts)/1000;
  if(s<60)return '剛剛';
  if(s<3600)return Math.floor(s/60)+' 分鐘前';
  if(s<86400)return Math.floor(s/3600)+' 小時前';
  if(s<86400*30)return Math.floor(s/86400)+' 天前';
  const d=new Date(ts);return `${d.getMonth()+1}/${d.getDate()}`;
}
const metaHTML=it=>(it.priv?ic('lock'):'')+(it.count?`已複製 ${it.count} 次 · ${ago(it.last)}`:(it.priv?'私密內容':'尚未使用'));

function cardHTML(it,i,t){

function emptyHTML(){

}
function render(anim){
  const list=visible(),t=terms();

  if(anim&&!reduce.matches)$$('.item',grid).forEach(el=>el.classList.add('enter'));

// 位置變化時用 FLIP 做彈性移動
function flip(fn){flipIn(grid,'.item','id',fn)}
function flipIn(box,sel,key,fn){
  const first=new Map($$(sel,box).map(el=>[el.dataset[key],el.getBoundingClientRect()]));
  fn();
  if(reduce.matches)return;
  $$(sel,box).forEach(el=>{
    const f=first.get(el.dataset[key]);
    if(!f){el.classList.add('pop');return}
    const l=el.getBoundingClientRect(),dx=f.left-l.left,dy=f.top-l.top;
    if(Math.abs(dx)<1&&Math.abs(dy)<1)return;
    el.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:620,easing:'cubic-bezier(.34,1.56,.64,1)'});
  });
}

/* ---------- 通知 ---------- */
const toastsEl=$('#toasts');
function toast(msg,icon='check',o={}){
  if(o.key)$$(`.toast[data-key="${o.key}"]`,toastsEl).forEach(dismiss);
  const t=document.createElement('div');t.className='toast';if(o.key)t.dataset.key=o.key;
  t.innerHTML=`<i class="${o.bad?'bad':''}">${ic(icon)}</i><span>${esc(msg)}${o.sub?`<small>${esc(o.sub)}</small>`:''}</span>`;
  if(o.action){const b=document.createElement('button');b.type='button';b.textContent=o.action.label;b.onclick=()=>{o.action.fn();dismiss(t)};t.append(b)}
  toastsEl.append(t);

  t._t=setTimeout(()=>dismiss(t),o.ms||2200);
}

    if(e.key==='ArrowDown'&&rows[k+1]){e.preventDefault();e.stopPropagation();rows[k+1].focus();return}
    if(e.key==='ArrowUp'){e.preventDefault();e.stopPropagation();(rows[k-1]||row.closest('.item')).focus();return}

  switch(e.key){

// 合併備份：目前只有範例資料時直接換成備份內容；否則加入不重複的項目
function mergeIn(d){
  if(seeded){db=d;seeded=false;applyPrefs();return {add:d.items.length,skip:0}}
  const map={};
  d.cats.forEach(c=>{let m=db.cats.find(x=>x.name===c.name);if(!m){m={id:uid(),name:c.name,color:c.color};db.cats.push(m)}map[c.id]=m.id});
  let add=0,skip=0;
  d.items.forEach(i=>{
    if(db.items.some(x=>x.content===i.content&&x.title===i.title)){skip++;return}
    db.items.push({...i,id:uid(),cat:i.cat?map[i.cat]||null:null});add++;
  });
  return {add,skip};
}

const FS_OK=typeof window.showDirectoryPicker==='function';
const BK_FILE='clipboard-backup.json', BK_DAY=/^clipboard-backup-\d{4}-\d\d-\d\d\.json$/, BK_KEEP=30;
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const BK={dir:null,perm:'none',sig:lsGet(KEY+'.bsig')||'',last:+lsGet(KEY+'.blast')||0,err:'',timer:0,running:false,again:false,asking:false};
function kv(mode,fn){
  return new Promise((res,rej)=>{
    const o=indexedDB.open('clipbox',1);
    o.onupgradeneeded=()=>o.result.createObjectStore('kv');
    o.onerror=()=>rej(o.error);
    o.onsuccess=()=>{const con=o.result,tx=con.transaction('kv',mode),q=fn(tx.objectStore('kv'));
      tx.oncomplete=()=>{con.close();res(q&&q.result)};tx.onerror=()=>{con.close();rej(tx.error)}};
  });
}
const kvGet=k=>kv('readonly',st=>st.get(k)), kvPut=(k,v)=>kv('readwrite',st=>st.put(v,k)), kvDel=k=>kv('readwrite',st=>st.delete(k));
// 只比對「內容」：複製次數、排序偏好改變不需要備份
function sig(){
  const str=JSON.stringify([db.cats,db.items.map(i=>[i.id,i.title,i.content,i.cat,i.pin,i.priv,i.lines])]);
  let h1=0xdeadbeef,h2=0x41c6ce57;
  for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (h2>>>0).toString(36)+(h1>>>0).toString(36)+'.'+str.length;
}
const bkPending=()=>!!BK.dir&&!seeded&&sig()!==BK.sig;
function backupCheck(){
  if(!BK.dir||seeded||sig()===BK.sig){renderBk();return}
  if(BK.perm!=='granted')askPerm(); // 修改的當下就是使用者操作，瀏覽器才允許跳出詢問
  clearTimeout(BK.timer);BK.timer=setTimeout(runBackup,1200);
  renderBk();
}
async function askPerm(){
  if(!BK.dir||BK.asking)return;
  BK.asking=true;
  try{BK.perm=await BK.dir.requestPermission({mode:'readwrite'})}catch(e){BK.perm='prompt'}
  BK.asking=false;renderBk();
  if(BK.perm==='granted')runBackup();
}
async function writeText(dir,name,text){
  const fh=await dir.getFileHandle(name,{create:true});
  const w=await fh.createWritable();await w.write(text);await w.close();
}
async function runBackup(force){
  if(!BK.dir||BK.perm!=='granted'||seeded){renderBk();return}
  if(BK.running){BK.again=true;return}
  const s=sig();
  if(s===BK.sig&&!force){renderBk();return}
  BK.running=true;
  const text=JSON.stringify(exportData(),null,2);
  try{
    await writeText(BK.dir,BK_FILE,text);
    await writeText(BK.dir,`clipboard-backup-${VARS.date(new Date())}.json`,text);
    const days=[];
    for await(const [name,h] of BK.dir.entries())if(h.kind==='file'&&BK_DAY.test(name))days.push(name);
    days.sort().reverse().slice(BK_KEEP).forEach(n=>BK.dir.removeEntry(n).catch(()=>{}));
    BK.sig=s;BK.last=Date.now();BK.err='';
    lsSet(KEY+'.bsig',s);lsSet(KEY+'.blast',String(BK.last));
  }catch(e){
    const was=BK.err;
    BK.err=e&&e.name==='NotFoundError'?'找不到備份資料夾（可能被移動或刪除）':e&&e.name==='NotAllowedError'?'沒有寫入備份資料夾的權限':'備份失敗：'+(e&&e.message||e);
    if(e&&e.name==='NotAllowedError')BK.perm='prompt';
    if(!was)toast('自動備份失敗','x',{bad:true,ms:4000,sub:BK.err});
  }
  BK.running=false;renderBk();
  if(BK.again){BK.again=false;runBackup()}
}
async function setupBackup(){
  let dir;
  try{dir=await window.showDirectoryPicker({id:'clipbox-backup',mode:'readwrite',startIn:'documents'})}
  catch(e){if(e&&e.name!=='AbortError')toast('無法選擇資料夾','x',{bad:true,sub:e.message});return}
  // 資料夾裡已經有備份 → 先合併進來，絕不直接覆蓋
  let note='';
  try{
    const fh=await dir.getFileHandle(BK_FILE);
    const d=normalize(JSON.parse(await (await fh.getFile()).text()));
    if(d&&d.items.length){const r=mergeIn(d);if(r.add){note=`已從原有備份加入 ${r.add} 則`;render(true)}}
  }catch(e){}
  BK.dir=dir;BK.perm='granted';BK.err='';
  try{await kvPut('bkdir',dir)}catch(e){toast('瀏覽器無法記住這個資料夾，下次開啟需要重新設定','x',{bad:true,ms:4000})}
  if(seeded)seeded=false; // 設定備份代表要開始使用，範例也一起存起來
  save();
  await runBackup(true);
  if(!BK.err)toast(`已開始自動備份到「${dir.name}」`,'cloud',{ms:3600,sub:note||'之後每次修改都會自動更新備份檔'});
}
async function stopBackup(){
  BK.dir=null;BK.perm='none';BK.err='';clearTimeout(BK.timer);
  try{await kvDel('bkdir')}catch(e){}
  renderBk();toast('已停止自動備份','cloud');
}
function renderBk(){
  const el=$('#bk');if(!el)return;
  let cls='',html;
  if(!FS_OK){
    html=`<div class="st"><i></i><div>這個瀏覽器不支援自動備份<small>請改用 Edge 或 Chrome，或定期按「匯出」</small></div></div>`;
  }else if(!BK.dir){
    html=`<div class="st"><i></i><div>尚未設定自動備份<small>建議在 OneDrive 裡新增一個資料夾（例如「剪貼簿備份」）並選它，之後每次修改都會自動存一份</small></div></div>
      <div class="acts"><button class="btn sm" type="button" data-bk="setup">${ic('cloud')}設定自動備份</button></div>`;
  }else if(BK.err){
    cls='bad';
    html=`<div class="st"><i></i><div>${esc(BK.err)}<small>備份資料夾：${esc(BK.dir.name)}</small></div></div>
      <div class="acts"><button class="btn sm" type="button" data-bk="setup">重新選擇資料夾</button>${BK.perm!=='granted'?`<button class="btn ghost sm" type="button" data-bk="allow">允許</button>`:''}</div>`;
  }else if(BK.perm==='granted'){
    cls=bkPending()?'wait':'ok';
    html=`<div class="st"><i></i><div>自動備份到「<b>${esc(BK.dir.name)}</b>」<small>${bkPending()?'正在備份…':BK.last?'上次備份：'+ago(BK.last):'已設定'}</small></div></div>
      <div class="acts"><button class="btn line sm" type="button" data-bk="setup">更換資料夾</button><button class="btn line sm" type="button" data-bk="stop">停止</button></div>`;
  }else{
    cls=bkPending()?'wait':'ok';
    html=`<div class="st"><i></i><div>自動備份到「<b>${esc(BK.dir.name)}</b>」<small>${bkPending()?'有修改尚未備份，需要你允許寫入':'下次修改時，瀏覽器會請你允許寫入一次'}${BK.last?' · 上次備份：'+ago(BK.last):''}</small></div></div>
      <div class="acts">${bkPending()?`<button class="btn sm" type="button" data-bk="allow">允許並備份</button>`:''}<button class="btn line sm" type="button" data-bk="setup">更換資料夾</button><button class="btn line sm" type="button" data-bk="stop">停止</button></div>`;
  }
  el.className='bk '+cls;el.innerHTML=html;
}
$('#bk').addEventListener('click',e=>{
  const b=e.target.closest('[data-bk]');if(!b)return;
  const a=b.dataset.bk;
  if(a==='setup')setupBackup();else if(a==='stop')stopBackup();else if(a==='allow')askPerm();
});
async function initBackup(){
  if(FS_OK){
    try{
      const d=await kvGet('bkdir');
      if(d){BK.dir=d;BK.perm=await d.queryPermission({mode:'readwrite'})}
    }catch(e){BK.dir=null}
  }
  renderBk();
  if(bkPending()&&BK.perm==='granted')runBackup(); // 上次有修改沒備份到，這次補上（只寫不讀）
}

/* ---------- 圖示：小尺寸用簡化版，大尺寸用有疊卡的版本 ---------- */
const ICON_BIG='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2a2f"/><stop offset="1" stop-color="#0c0c0d"/></linearGradient></defs><rect width="512" height="512" rx="120" fill="url(#g)"/><rect x="176" y="96" width="236" height="304" rx="46" fill="#45454c" transform="rotate(9 294 248)"/><rect x="112" y="118" width="252" height="322" rx="48" fill="#fff"/><rect x="172" y="80" width="132" height="78" rx="30" fill="#2bd96b" stroke="#1b1b1f" stroke-width="18" paint-order="stroke"/><rect x="160" y="222" width="156" height="32" rx="16" fill="#0c0c0d"/><rect x="160" y="284" width="156" height="32" rx="16" fill="#0c0c0d"/><rect x="160" y="346" width="96" height="32" rx="16" fill="#2bd96b"/></svg>';
async function makeIco(){
  const load=u=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('圖示載入失敗'));im.src=u});
  const [sm,bg]=await Promise.all([load($('link[rel="icon"]').href),load('data:image/svg+xml,'+encodeURIComponent(ICON_BIG))]);
  const sizes=[16,24,32,48,64,256];
  const bufs=await Promise.all(sizes.map(z=>{
    const c=document.createElement('canvas');c.width=c.height=z;
    const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(z<=32?sm:bg,0,0,z,z);
    return new Promise((res,rej)=>c.toBlob(b=>b?res(b.arrayBuffer()):rej(new Error('無法產生圖示')),'image/png'));
  }));
  const n=sizes.length,head=new DataView(new ArrayBuffer(6+16*n));
  head.setUint16(2,1,true);head.setUint16(4,n,true);
  let off=6+16*n;
  sizes.forEach((z,i)=>{const o=6+16*i;head.setUint8(o,z%256);head.setUint8(o+1,z%256);head.setUint16(o+4,1,true);head.setUint16(o+6,32,true);head.setUint32(o+8,bufs[i].byteLength,true);head.setUint32(o+12,off,true);off+=bufs[i].byteLength});
  return new Blob([head.buffer,...bufs],{type:'image/x-icon'});
}
async function downloadIco(){
  try{
    const url=URL.createObjectURL(await makeIco());
    const a=document.createElement('a');a.href=url;a.download='ClipBoard.ico';document.body.append(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    toast('已下載 ClipBoard.ico','down',{sub:'請把它移到和 ClipBoard.html 同一個資料夾，再到捷徑裡選它'});
  }catch(e){toast('無法產生圖示檔','x',{bad:true,sub:e.message})}
}

      <li><div>在「輸入項目的位置」貼上這一段，按「下一步」
        <div class="cmd"><code id="lnkCmd">${esc(cmd)}</code><button class="btn sm" type="button" id="lnkCopy">${ic('copy')}複製</button></div></div></li>
      <li><div>名稱輸入「<b>常用剪貼簿</b>」，按「完成」</div></li>

        <div class="cmd"><code>${esc(icoPath)}</code><button class="btn ghost sm" type="button" id="icoDl">${ic('down')}下載圖示檔</button></div>
        <p class="hint" style="margin-top:6px">資料夾裡沒有 ClipBoard.ico 的話，按「下載圖示檔」，再把它移到上面這個資料夾。</p></div></li>
    </ol>
    ${tooLong?`<div class="tip warn">這個檔案的路徑太長（超過 Windows 捷徑的 260 字上限）。請把 ClipBoard.html 移到比較短的位置，例如「文件」資料夾，再重新打開這個說明。</div>`:''}
    <div class="tip">
      ・快速鍵只對放在<b>桌面</b>或<b>開始功能表</b>的捷徑有效。<br>
      ・每按一次快速鍵會開一個新視窗，資料都是同一份。<br>
      ・想要開機自動開啟：按 <kbd>Win</kbd>+<kbd>R</kbd> 輸入 <b>shell:startup</b>，把捷徑複製一份到開啟的資料夾。<br>
      ・第 2 步如果出現「找不到」，把指令裡的 <b>Program Files (x86)</b> 改成 <b>Program Files</b> 再試一次。<br>
      ・不要移動 ClipBoard.html，否則捷徑會失效（資料不會不見，重新建立捷徑即可）。
    </div>
    <div class="mf"><span class="sp"></span><button class="btn sm" type="button" data-close="1">完成</button></div>`,
  {dirty:()=>false,save(){closeModal()}});
  $('#icoDl').addEventListener('click',downloadIco);
  $('#lnkCopy').addEventListener('click',async()=>{
    if(await writeClip(cmd)){const b=$('#lnkCopy');b.innerHTML=`${ic('check')}已複製`;setTimeout(()=>{if(b.isConnected)b.innerHTML=`${ic('copy')}複製`},1500)}
